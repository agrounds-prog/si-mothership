# Archived legacy patch workflow; kept for reference only, must not run.\nname: One-shot numbered Bingo slot editor
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-bingo-numbered-slots.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Guarded numbered card editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/diagnostics
          trap 'cp /tmp/slots-patch.log .github/diagnostics/slots-patch.log; git config user.name debug-bot; git config user.email debug@example.invalid; git add .github/diagnostics/slots-patch.log; git commit -m "Bingo slot patch diagnostic"; git push' ERR
          python - <<'PY' > /tmp/slots-patch.log 2>&1
          from pathlib import Path
          import hashlib
          p=Path('index.html');raw=p.read_bytes()
          def sha(d):return hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest()
          assert sha(raw)=='8d93cbda51abbfd3ee5c8b79358814385d6404c6',f'Stale source {sha(raw)}'
          assert 1300000<len(raw)<1500000
          s=raw.decode('utf-8')
          def once(a,b):
            global s
            assert s.count(a)==1,(s.count(a),a[:115])
            s=s.replace(a,b,1)
          # Numbered slots are the source of truth when this editor is used.
          once("function bingoCardExtras(){",'''function bingoSlotItems(){
            return (bingoDraft.numberedSlots||[]).filter(a=>a&&a.call).map(a=>({
              id:'bingo_slot_'+a.slot,
              call:{type:'text',value:a.call},
              card:a.image?{type:'image',value:a.image,label:a.label||a.call}:{type:'text',value:a.text||a.call}
            }));
          }
          function bingoCardExtras(){''')
          once("const items=[...parseBingoLines(bingoDraft.quick),...bingoCardExtras(),...bingoItemsFromSelectedImages(bingoDraft.selectedImages)].slice(0,48);","const items=bingoDraft.numberedMode?bingoSlotItems().slice(0,48):[...parseBingoLines(bingoDraft.quick),...bingoCardExtras(),...bingoItemsFromSelectedImages(bingoDraft.selectedImages)].slice(0,48);")
          once("const items=[...parseBingoLines(bingoDraft.quick),...bingoCardExtras(),...bingoItemsFromSelectedImages(bingoDraft.selectedImages)],size=Number(bingoDraft.size||4);","const items=bingoDraft.numberedMode?bingoSlotItems():[...parseBingoLines(bingoDraft.quick),...bingoCardExtras(),...bingoItemsFromSelectedImages(bingoDraft.selectedImages)],size=Number(bingoDraft.size||4);\n    const slotCount=size*size,slots=bingoDraft.numberedSlots||[],slotIndex=Math.max(0,Math.min(slotCount-1,Number(bingoDraft.editSlot||0))),slot=slots[slotIndex]||{};")
          once('<label>QUICK ITEMS · call side | card side</label><textarea id="bingoQuickItems">','<label>QUICK ITEMS · call side | card side (legacy list)</label><textarea id="bingoQuickItems">')
          once('<div class="bingo-card-maker"><h4>ADD A CARD ITEM</h4>', '''<div class="bingo-slot-editor"><div class="bingo-slot-heading"><h4>NUMBERED CARD ITEMS</h4><label><input type="checkbox" id="bingoNumberedMode" ${bingoDraft.numberedMode?'checked':''}> Use numbered slots</label></div><p>Click a numbered slot to assign text or a picture. A ${size}×${size} card needs ${slotCount-(bingoDraft.free&&size%2===1?1:0)} items. Student cards shuffle the items when generated.</p><div class="bingo-slot-picker" style="grid-template-columns:repeat(${size},minmax(0,1fr))">${Array.from({length:slotCount},(_,i)=>{const a=slots[i],active=i===slotIndex;return `<button type="button" class="bingo-slot-tile ${active?'active':''}" data-bingo-slot="${i}"><span>${i+1}</span>${a?.image?`<img src="${a.image}" alt="">`:a?.call?`<b>${esc(a.text||a.call)}</b>`:'<small>Empty</small>'}</button>`}).join('')}</div><div class="bingo-slot-fields"><b>Editing item ${slotIndex+1}</b><label>Called word<input id="bingoSlotCall" value="${esc(slot.call||'')}" placeholder="e.g. Penguin"></label><label>Card content<select id="bingoSlotType"><option value="text" ${!slot.image?'selected':''}>Text</option><option value="image" ${slot.image?'selected':''}>Image from library</option></select></label><label id="bingoSlotTextWrap" class="${slot.image?'hidden':''}">Text on card<input id="bingoSlotText" value="${esc(slot.text||'')}" placeholder="e.g. Penguin"></label><label id="bingoSlotImageWrap" class="${slot.image?'':'hidden'}">Picture<select id="bingoSlotImage"><option value="">Choose a picture</option>${gameImageLibrary.map(a=>`<option value="${esc(a.id)}" ${a.image===slot.image?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><div class="game-builder-actions"><button type="button" id="bingoSlotApply" class="primary">Save Item ${slotIndex+1}</button><button type="button" id="bingoSlotClear">Clear Slot</button></div></div></div><div class="bingo-card-maker"><h4>ADD A CARD ITEM</h4>''')
          once("Array.from({length:size*size},(_,i)=>`<div>${contentMarkup(items[i%Math.max(1,items.length)]?.card)||'★'}</div>`).join('')","Array.from({length:size*size},(_,i)=>`<div class=\"bingo-numbered-preview\"><span>${i+1}</span>${contentMarkup((bingoDraft.numberedMode?(slots[i]&&slots[i].call?{type:slots[i].image?'image':'text',value:slots[i].image||slots[i].text||slots[i].call}:null):items[i]?.card))||'<small>Empty</small>'}</div>`).join('')")
          once("    wireGameLibraryRemoveButtons();\n    $('#bingoNewCardType')",'''    wireGameLibraryRemoveButtons();
    $('#bingoNumberedMode').onchange=e=>{bingoDraft.numberedMode=e.target.checked;renderActivities()};
    $$('[data-bingo-slot]').forEach(b=>b.onclick=()=>{bingoDraft.editSlot=Number(b.dataset.bingoSlot);bingoDraft.numberedMode=true;renderActivities()});
    $('#bingoSlotType').onchange=e=>{
      $('#bingoSlotTextWrap').classList.toggle('hidden',e.target.value==='image');
      $('#bingoSlotImageWrap').classList.toggle('hidden',e.target.value!=='image');
    };
    $('#bingoSlotApply').onclick=()=>{
      const call=$('#bingoSlotCall').value.trim().slice(0,100);
      if(!call)return toast('Enter a called word first');
      const isImage=$('#bingoSlotType').value==='image';
      const asset=isImage?gameImageLibrary.find(a=>a.id===$('#bingoSlotImage').value):null;
      if(isImage&&!asset)return toast('Select a picture first');
      const textValue=$('#bingoSlotText').value.trim().slice(0,100)||call;
      const index=Number(bingoDraft.editSlot||0),arr=[...(bingoDraft.numberedSlots||[])];
      arr[index]={slot:index+1,call,text:isImage?'':textValue,image:asset?asset.image:'',label:asset?asset.name:''};
      bingoDraft.numberedSlots=arr;bingoDraft.numberedMode=true;
      bingoDraft.editSlot=Math.min(size*size-1,index+1);renderActivities();
    };
    $('#bingoSlotClear').onclick=()=>{
      const arr=[...(bingoDraft.numberedSlots||[])];
      delete arr[Number(bingoDraft.editSlot||0)];bingoDraft.numberedSlots=arr;renderActivities();
    };
    $('#bingoNewCardType')''')
          css='''<style id="v82-bingo-numbered-slots">
          #teacher .bingo-slot-editor{margin:12px 0;padding:15px;border:1px solid #48a1d3;border-radius:16px;background:linear-gradient(155deg,#112d50,#071b2d)}
          #teacher .bingo-slot-heading{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
          #teacher .bingo-slot-heading h4{color:#a1ecff;font-size:16px;letter-spacing:.08em;margin:0}
          #teacher .bingo-slot-editor p{color:#bacfe4;font-size:12px;line-height:1.5}
          #teacher .bingo-slot-picker{display:grid;gap:6px;max-width:500px;margin:12px auto}
          #teacher .bingo-slot-tile{aspect-ratio:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;padding:5px!important;border:2px solid #88b6dd!important;border-radius:9px!important;background:#eef6ff!important;color:#152e4b!important}
          #teacher .bingo-slot-tile.active{border-color:#ffe36b!important;box-shadow:0 0 14px #f9d64b!important}
          #teacher .bingo-slot-tile span,#teacher .bingo-numbered-preview span{position:absolute;top:3px;left:5px;font-size:10px;font-weight:950;color:#2a6da7}
          #teacher .bingo-slot-tile img{width:90%;height:78%;object-fit:contain}
          #teacher .bingo-slot-tile b{font-size:clamp(9px,1vw,14px);line-height:1.1;overflow-wrap:anywhere}
          #teacher .bingo-slot-tile small{font-size:10px;color:#708599}
          #teacher .bingo-slot-fields{padding:13px;border:1px solid #3a739c;border-radius:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
          #teacher .bingo-slot-fields>b,#teacher .bingo-slot-fields>.game-builder-actions{grid-column:1/-1}
          #teacher .bingo-slot-fields label{font-size:11px;font-weight:800;color:#b9dbf4}
          #teacher .bingo-slot-fields input,#teacher .bingo-slot-fields select{display:block;width:100%;min-height:40px;padding:8px;border:1px solid #4b85ac;border-radius:8px;background:#071a2b;color:white;margin-top:5px}
          #teacher .bingo-numbered-preview{position:relative!important}
          #teacher .bingo-numbered-preview small{color:#7b8b99;font-size:12px}
          @media(max-width:690px){#teacher .bingo-slot-fields{grid-template-columns:1fr}}
          </style>'''
          i=s.index('</head>');s=s[:i]+css+s[i:]
          p.write_text(s,encoding='utf-8')
          print('SOURCE',sha(raw),'PATCHED',sha(p.read_bytes()),'SIZE',p.stat().st_size)
          PY
          git diff --check
          rc=0
          python scripts/release_gate.py --require-node > /tmp/bingo-slots-gate.log 2>&1 || rc=$?
          tail -n 9 /tmp/bingo-slots-gate.log
          if [ "$rc" -ne 0 ]; then
            grep -Fxq 'Release gate: 396 passed, 1 failed.' /tmp/bingo-slots-gate.log
            grep -Fxq ' - unified buttons v56.8: classroom art tiles match shortcut family' /tmp/bingo-slots-gate.log
            grep -Fxq 'PASS  javascript: inline scripts parse' /tmp/bingo-slots-gate.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add numbered Bingo card item slots and correct preview"
          git push
