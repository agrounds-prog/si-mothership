name: Mothership Chromium Startup Smoke

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_browser_boot_smoke.cjs'
      - '.github/workflows/browser-startup-smoke.yml'
      - 'server.py'
      - 'index.html'
      - 'quick-poll.js'
      - 'quick-poll.css'
      - 'word-grid.js'
      - 'word-grid.css'
      - 'tests/test_word_grid_engine.cjs'
      - 'tests/test_word_grid_browser.cjs'
      - 'bingo-board-studio.js'
      - 'dashboard-polish.js'
      - 'dashboard-polish.css'
      - 'quick_poll_server.py'
      - 'million-studio.js'
      - 'million-studio.css'
      - 'tests/test_million_studio_browser.cjs'
      - 'tests/test_million_multiplayer.py'
      - 'tests/test_million_websocket_live.py'
      - 'tests/test_million_projector_browser.cjs'
      - 'tests/test_quick_poll_projector_browser.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and Chromium
        run: |
          pip install -r requirements.txt
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local Mothership in isolated storage
        run: |
          mkdir -p /tmp/mothership-browser-smoke
          MOTHERSHIP_NO_BROWSER=1 MOTHERSHIP_DATA_DIR=/tmp/mothership-browser-smoke PORT=8877 python server.py > /tmp/mothership-browser.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8877/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mothership-browser.log
          exit 1
      - name: Verify fresh Quick Poll assets and visible projector graphics
        run: |
          set -e
          node --check quick-poll.js
          python -m py_compile server.py quick_poll_server.py
          python - <<'PY'
          import hashlib,re,urllib.request
          from pathlib import Path
          base="http://127.0.0.1:8877"
          with urllib.request.urlopen(base+"/") as response:
              html=response.read().decode()
          actual=hashlib.sha256(Path("quick-poll.js").read_bytes()+Path("quick-poll.css").read_bytes()).hexdigest()[:14]
          js=re.search(r'/quick-poll[.]js[?]v=([a-z0-9]+)',html)
          css=re.search(r'/quick-poll[.]css[?]v=([a-z0-9]+)',html)
          assert js and css and js.group(1)==css.group(1)==actual,(js,css,actual)
          for kind,marker in (("js","qp-v4-projector"),("css","QUICK POLL · SHARED-SCREEN SHOW GRAPHICS v4")):
              with urllib.request.urlopen(base+"/quick-poll."+kind+"?v="+actual) as response:
                  content=response.read().decode("utf-8")
                  assert "no-store" in response.headers.get("Cache-Control","")
                  assert marker in content,(kind,marker)
          print("Quick Poll JS and CSS loaded with matching SHA256 fingerprint",actual)
          PY
      - name: Verify dashboard presentation JavaScript syntax
        run: |
          node --check dashboard-polish.js
          node --check million-studio.js
      - name: WORD GRID gameplay, tile scoring, shared screen, and saved game browser regression
        run: |
          node --check word-grid.js
          node tests/test_word_grid_engine.cjs
          node tests/test_word_grid_browser.cjs
      - name: Quick Poll server integration and vote lifecycle
        run: python -m unittest discover -s tests -p 'test_quick_poll.py' -v
      - name: Quick Poll four projector graphic layouts, shared reveal, mirror and Zoom resolutions
        run: node tests/test_quick_poll_projector_browser.cjs
      - name: MILLION synthetic multiplayer and privacy rules
        run: python -m unittest discover -s tests -p 'test_million_multiplayer.py' -v
      - name: MILLION real multi-client WebSocket and reset test
        run: python -m unittest discover -s tests -p 'test_million_websocket_live.py' -v
      - name: MILLION local Chromium saved games and mobile controls
        run: node tests/test_million_studio_browser.cjs
      - name: Browser bootstrap on local and production
        run: node tests/test_browser_boot_smoke.cjs
      - name: MILLION five-question projector, Zoom resolutions and classic-risk game flow
        run: node tests/test_million_projector_browser.cjs
      - name: Print app startup diagnostics on failure
        if: failure()
        run: tail -80 /tmp/mothership-browser.log
