name: Match Arcade regression checks
on:
  push:
    paths:
      - index.html
      - match-arcade.js
      - match-arcade.css
      - tests/test_match_gameplay_visuals_browser.cjs
      - server.py
      - tests/test_match_arcade_preview.py
      - .github/workflows/match-arcade-regressions.yml
  workflow_dispatch:
jobs:
  match-arcade-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing server requirements
        run: python -m pip install -r requirements.txt
      - name: Validate standalone and main JavaScript
        run: |
          node --check match-arcade.js
          node --check cosmic-cards.js
          python -m py_compile server.py
          python scripts/release_gate.py --require-node > /tmp/match_gate.log || true
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/match_gate.log').read_text().splitlines()
          bad=[x for x in lines if x.startswith('FAIL')]
          print('Pre-existing release gate issues:',bad)
          allowed=('unified buttons v56.8: classroom art tiles match shortcut family','activity library: every registered app category is represented')
          assert all(any(expected in x for expected in allowed) for x in bad),bad
          assert any(x.startswith('PASS') and 'inline scripts parse' in x for x in lines),'Inline JS syntax gate missing'
          print('PASS inline syntax; no new release-gate failures')
          PY
      - name: Run MATCH gameplay and teacher authorization regressions
        run: python -m unittest discover -s tests -p 'test_match_arcade_preview.py' -v
      - name: Install Chromium for isolated MATCH stage regression
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify MATCH teacher, compact student, projector and final stage
        run: |
          mkdir -p /tmp/mothership-match-4pb-regression
          MOTHERSHIP_NO_BROWSER=1 MOTHERSHIP_DATA_DIR=/tmp/mothership-match-4pb-regression PORT=8885 python server.py >/tmp/match-4pb-regression.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8885/api/health >/dev/null; then break; fi
            sleep 1
          done
          LOCAL_URL=http://127.0.0.1:8885 node tests/test_match_gameplay_visuals_browser.cjs
      - name: Verify clean patch
        run: git diff --check
