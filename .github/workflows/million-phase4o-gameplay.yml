name: MILLION Gameplay and Teacher Studio Regression
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'server.py'
      - 'million-studio.js'
      - 'million-studio.css'
      - 'tests/test_million_multiplayer.py'
      - 'tests/test_million_websocket_live.py'
      - 'tests/test_million_studio_browser.cjs'
      - 'tests/test_million_projector_browser.cjs'
      - '.github/workflows/million-phase4o-gameplay.yml'
  workflow_dispatch:

permissions: {contents: read}
jobs:
  million-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MOTHERSHIP_NO_BROWSER: '1'
      MOTHERSHIP_DATA_DIR: /tmp/mothership-million-phase4o
      LOCAL_URL: http://127.0.0.1:8877
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: MILLION source and release verification
        run: |
          node --check million-studio.js
          node --check tests/test_million_studio_browser.cjs
          node --check tests/test_million_projector_browser.cjs
          python -m py_compile server.py tests/test_million_multiplayer.py tests/test_million_websocket_live.py
          python scripts/release_gate.py --require-node
      - name: Install isolated browser and server dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: MILLION lifelines and authoritative server rules
        run: python -m unittest discover -s tests -p test_million_multiplayer.py -v
      - name: MILLION websocket privacy, turns and persistence
        run: python -m unittest discover -s tests -p test_million_websocket_live.py -v
      - name: Start disposable localhost classroom
        run: |
          mkdir -p /tmp/mothership-million-phase4o
          MOTHERSHIP_NO_BROWSER=1 MOTHERSHIP_DATA_DIR=/tmp/mothership-million-phase4o PORT=8877 python server.py >/tmp/million-phase4o.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8877/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/million-phase4o.log
          exit 1
      - name: MILLION Studio save, edit, reset and reload
        run: node tests/test_million_studio_browser.cjs
      - name: MILLION teacher, projector, lifelines and timed rounds
        run: node tests/test_million_projector_browser.cjs
      - name: Diagnostics on failure
        if: failure()
        run: tail -120 /tmp/million-phase4o.log || true
