name: One-shot Student Device cinematic patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-student-cinematic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and patch full index safely
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='86affb8bff443f3f3175f38927061f2afa598c01'
          ACTUAL_BLOB="$(git hash-object index.html)"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB" || { echo "Refusing patch: expected $EXPECTED_BLOB, found $ACTUAL_BLOB"; exit 1; }
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=len(s)
          replacements={
          '''if(state.screen==='lobby')return `<div class="student-prompt activity-wait"><span class="eyebrow">CLASS LOBBY</span><h2>You’re in!</h2><p>Waiting for your teacher to begin…</p><div class="student-lobby-avatar">${studentAvatarBadgeMarkup(s)}</div></div>`;''':'''if(state.screen==='lobby')return `<div class="student-prompt activity-wait cinematic-student-window cinematic-lobby"><span class="eyebrow">CLASS LOBBY</span><div class="cinematic-status-line"><i></i><span>DOCKING COMPLETE · CREW LINK ACTIVE</span></div><h2>You’re in!</h2><p>Waiting for your teacher to begin…</p><div class="student-lobby-avatar cinematic-pilot-card">${studentAvatarBadgeMarkup(s)}</div><div class="cinematic-horizon" aria-hidden="true"></div></div>`;''',
          '''if(state.screen==='classroom')return `<div class="student-prompt"><span class="eyebrow">CLASSROOM LIVE</span><h2>Welcome aboard</h2><p>Use your Classroom Controls when your teacher enables them.</p></div>`;''':'''if(state.screen==='classroom')return `<div class="student-prompt cinematic-student-window cinematic-classroom"><div class="cinematic-classroom-grid"><div class="student-lobby-avatar cinematic-pilot-card">${studentAvatarBadgeMarkup(s)}</div><div class="cinematic-message-console"><span class="eyebrow">CLASSROOM LIVE</span><div class="cinematic-status-line"><i></i><span>MOTHERSHIP LINK · STANDBY</span></div><h2>Welcome aboard</h2><p>Use your Classroom Controls when your teacher enables them.</p></div></div><div class="cinematic-horizon" aria-hidden="true"></div></div>`;''',
          '''if(state.screen==='agenda'&&!state.agendaLive)return `<div class="student-prompt"><span class="eyebrow">CLASSROOM LIVE</span><h2>Waiting for your teacher</h2><p>The next Agenda item has not been launched yet.</p></div>`;''':'''if(state.screen==='agenda'&&!state.agendaLive)return `<div class="student-prompt cinematic-student-window cinematic-classroom"><div class="cinematic-classroom-grid"><div class="student-lobby-avatar cinematic-pilot-card">${studentAvatarBadgeMarkup(s)}</div><div class="cinematic-message-console"><span class="eyebrow">CLASSROOM LIVE</span><div class="cinematic-status-line"><i></i><span>AWAITING TRANSMISSION</span></div><h2>Waiting for your teacher</h2><p>The next Agenda item has not been launched yet.</p></div></div><div class="cinematic-horizon" aria-hidden="true"></div></div>`;'''
          }
          for old,new in replacements.items():
              count=s.count(old)
              if count!=1: raise SystemExit(f'Expected exactly one markup target, found {count}')
              s=s.replace(old,new,1)
          css=r'''
          <style id="v58-student-cinematic-surfaces">
          /* Dedicated Student Device lobby/classroom surfaces. Visual-only; no control IDs or handlers. */
          body.role-student .device-main:has(.cinematic-student-window){padding:22px!important;background:radial-gradient(circle at 50% -15%,rgba(38,147,237,.28),transparent 38%),linear-gradient(180deg,#020a14,#07182a 58%,#030b14)!important}
          body.role-student .cinematic-student-window{width:min(900px,100%)!important;max-width:900px!important;min-height:430px!important;padding:42px 44px 38px!important;position:relative!important;overflow:hidden!important;isolation:isolate!important;border:2px solid #2ca3d1!important;border-radius:32px!important;background:radial-gradient(circle at 50% 34%,rgba(30,127,198,.30),transparent 34%),linear-gradient(180deg,#06182a 0%,#04111f 68%,#06192a 100%)!important;box-shadow:inset 0 0 0 7px #020a13,inset 0 0 0 8px rgba(91,232,255,.16),inset 0 -46px 90px rgba(16,97,161,.11),0 28px 70px rgba(0,0,0,.56),0 0 44px rgba(50,194,255,.17)!important}
          body.role-student .cinematic-student-window:before{content:""!important;display:block!important;position:absolute!important;inset:17px!important;z-index:-1!important;border:1px solid rgba(93,218,255,.22)!important;border-radius:22px!important;background:linear-gradient(115deg,transparent 0 12%,rgba(83,210,255,.07) 12.2% 12.7%,transparent 13% 87%,rgba(83,210,255,.07) 87.3% 87.8%,transparent 88%)!important;pointer-events:none!important}
          body.role-student .cinematic-student-window:after{content:""!important;display:block!important;position:absolute!important;left:50%!important;top:-115px!important;width:72%!important;height:230px!important;z-index:-1!important;transform:translateX(-50%)!important;border:2px solid rgba(81,203,241,.22)!important;border-radius:50%!important;box-shadow:0 0 60px rgba(52,185,240,.11)!important;pointer-events:none!important}
          body.role-student .cinematic-lobby{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important}
          body.role-student .cinematic-status-line{display:flex!important;align-items:center!important;justify-content:center!important;gap:9px!important;margin:10px 0 2px!important;color:#7eb4c8!important;font-size:9px!important;font-weight:900!important;letter-spacing:.16em!important;text-transform:uppercase!important}
          body.role-student .cinematic-status-line i{width:7px!important;height:7px!important;border-radius:50%!important;background:#62f1c0!important;box-shadow:0 0 12px #62f1c0!important;animation:beacon 1.7s ease-in-out infinite!important}
          body.role-student .cinematic-student-window h2{font-size:clamp(38px,6vw,58px)!important;margin:13px 0 7px!important;letter-spacing:-.055em!important}
          body.role-student .cinematic-student-window p{font-size:17px!important;color:#bdd3df!important;margin:0 auto!important;max-width:610px!important}
          body.role-student .cinematic-pilot-card{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:8px!important;min-width:235px!important;margin:26px auto 5px!important;padding:19px 26px 15px!important;border:1px solid #3aa8cf!important;border-radius:28px!important;background:radial-gradient(circle at 50% 18%,rgba(59,181,230,.18),transparent 45%),linear-gradient(180deg,#0a2a40,#061825)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 4px rgba(2,11,19,.45),0 17px 38px rgba(0,0,0,.37),0 0 34px rgba(45,205,255,.18)!important}
          body.role-student .cinematic-pilot-card .student-avatar-mini{width:156px!important;height:156px!important;border-width:4px!important;border-radius:38px!important;background:radial-gradient(circle at 50% 36%,#174b69,#06131f 72%)!important;font-size:86px!important;box-shadow:inset 0 0 0 6px rgba(2,11,19,.68),0 0 0 1px rgba(205,250,255,.20),0 0 46px color-mix(in srgb,var(--avatar-color,#5be8ff) 43%,transparent)!important}
          body.role-student .cinematic-pilot-card .student-avatar-mini img{border-radius:32px!important}
          body.role-student .cinematic-pilot-card b{font-size:19px!important;color:#f3fcff!important;letter-spacing:.01em!important}
          body.role-student .cinematic-pilot-card small{font-size:9px!important;color:#79a8bc!important;letter-spacing:.14em!important;text-transform:uppercase!important}
          body.role-student .cinematic-horizon{position:absolute!important;left:9%!important;right:9%!important;bottom:19px!important;height:64px!important;z-index:-1!important;opacity:.55!important;transform:perspective(180px) rotateX(66deg)!important;border-top:1px solid rgba(75,209,255,.31)!important;background:repeating-linear-gradient(90deg,transparent 0 42px,rgba(72,202,245,.14) 43px 44px),repeating-linear-gradient(0deg,transparent 0 13px,rgba(72,202,245,.12) 14px 15px)!important;mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)!important}
          body.role-student .cinematic-classroom{display:block!important;text-align:left!important}
          body.role-student .cinematic-classroom-grid{width:100%!important;display:grid!important;grid-template-columns:250px minmax(0,1fr)!important;gap:38px!important;align-items:center!important;position:relative!important;z-index:2!important}
          body.role-student .cinematic-classroom .cinematic-pilot-card{min-width:0!important;width:100%!important;margin:0!important;padding:17px 18px 14px!important}
          body.role-student .cinematic-classroom .cinematic-pilot-card .student-avatar-mini{width:142px!important;height:142px!important;font-size:78px!important}
          body.role-student .cinematic-message-console{min-height:260px!important;display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:center!important;padding:26px 28px!important;border:1px solid rgba(55,156,196,.48)!important;border-radius:22px!important;background:linear-gradient(180deg,rgba(7,30,48,.90),rgba(5,19,31,.92))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 30px rgba(41,162,214,.05)!important}
          body.role-student .cinematic-message-console .eyebrow{align-self:flex-start!important}
          body.role-student .cinematic-message-console .cinematic-status-line{justify-content:flex-start!important}
          body.role-student .cinematic-message-console h2{margin-left:0!important;text-align:left!important}
          body.role-student .cinematic-message-console p{margin-left:0!important;text-align:left!important;max-width:520px!important}
          @media(max-width:720px){body.role-student .device-main:has(.cinematic-student-window){padding:10px!important}body.role-student .cinematic-student-window{min-height:420px!important;padding:28px 17px 26px!important;border-radius:24px!important}body.role-student .cinematic-student-window h2{font-size:36px!important}body.role-student .cinematic-pilot-card{min-width:190px!important;margin-top:20px!important;padding:14px 19px 12px!important}body.role-student .cinematic-pilot-card .student-avatar-mini{width:118px!important;height:118px!important;border-radius:30px!important;font-size:66px!important}body.role-student .cinematic-classroom-grid{grid-template-columns:1fr!important;gap:16px!important}body.role-student .cinematic-classroom .cinematic-pilot-card{width:190px!important;margin:0 auto!important}body.role-student .cinematic-classroom .cinematic-pilot-card .student-avatar-mini{width:108px!important;height:108px!important;font-size:60px!important}body.role-student .cinematic-message-console{min-height:190px!important;align-items:center!important;padding:20px 16px!important;text-align:center!important}body.role-student .cinematic-message-console .eyebrow{align-self:center!important}body.role-student .cinematic-message-console .cinematic-status-line{justify-content:center!important}body.role-student .cinematic-message-console h2,body.role-student .cinematic-message-console p{margin-left:auto!important;margin-right:auto!important;text-align:center!important}}
          </style>
          '''
          if 'id="v58-student-cinematic-surfaces"' in s: raise SystemExit('Patch already present')
          pos=s.rfind('</head>')
          if pos<0: raise SystemExit('Missing </head>')
          s=s[:pos]+css+s[pos:]
          if not (original < len(s) < original+12000): raise SystemExit(f'Unexpected size delta {len(s)-original}')
          if s.count('cinematic-student-window') < 3: raise SystemExit('Dedicated markup classes missing')
          p.write_text(s,encoding='utf-8')
          print('old_chars',original,'new_chars',len(s),'delta',len(s)-original)
          PY
          rm -f .github/workflows/one-shot-student-cinematic.yml
          NEW_BLOB="$(git hash-object index.html)"
          NEW_BYTES="$(wc -c < index.html)"
          echo "new_blob=$NEW_BLOB new_bytes=$NEW_BYTES"
          test "$NEW_BYTES" -gt 1200000
          test "$NEW_BYTES" -lt 1260000
      - name: Commit only the contained visual change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-student-cinematic.yml
          git diff --cached --stat
          git commit -m 'Make Student Device lobby and classroom cinematic'
          git push origin HEAD:main
