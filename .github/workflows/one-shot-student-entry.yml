name: One-shot Student Device entry fix
on:
  push:
    paths: ['.github/workflows/one-shot-student-entry.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch actual student entry screens
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "92de8cd1acc0587122bca9f7bbdba76e1aa39c7e"
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="v59-student-join-cockpit"'
          assert marker not in s
          assert s.count('function studentJoinMarkup()') == 1
          assert s.count('class="student-join-flow code-join-flow"') == 1
          assert s.count('class="student-join-flow avatar-select-flow"') == 1
          assert s.count('class="student-join-flow confirm-join-flow"') == 1
          style="<style id=\"v59-student-join-cockpit\">\n/* Student entry: own surface distinct from post-join Lobby. */\nbody.role-student .device-main:has(.student-join-flow){padding:20px!important;background:radial-gradient(ellipse at 50% 0%,#173b59 0%,#071b30 45%,#020913 100%)!important;min-height:min(76vh,760px)!important}\nbody.role-student .student-join-flow{width:min(100%,1040px)!important;max-width:1040px!important;position:relative!important;padding:12px!important;margin:auto!important}\nbody.role-student .student-join-card{position:relative!important;width:100%!important;max-width:none!important;overflow:hidden!important;isolation:isolate!important;border:2px solid #4ac7ee!important;border-radius:32px!important;background:radial-gradient(ellipse at 50% 0%,rgba(24,112,162,.35),transparent 48%),linear-gradient(165deg,#08263c,#041322 62%,#071a2b)!important;box-shadow:inset 0 0 0 8px #030e18,inset 0 0 0 9px rgba(91,219,255,.23),0 25px 65px #0009,0 0 38px #19adff3a!important}\nbody.role-student .student-join-card:before{content:\"SI // MOTHERSHIP     •     STUDENT FLIGHT DECK\";display:block!important;position:relative!important;text-align:center!important;letter-spacing:.16em!important;font-size:clamp(9px,1.3vw,12px)!important;font-weight:900!important;color:#99efff!important;padding:15px 8px!important;margin:-6px -6px 26px!important;border-bottom:1px solid #41a9c755!important;background:linear-gradient(90deg,transparent,#16658a55,transparent)!important}\nbody.role-student .student-join-card:after{content:\"\";position:absolute;inset:auto 30px 13px;height:3px;border-radius:99px;background:linear-gradient(90deg,transparent,#3bd6ff 28%,#f7b64e 72%,transparent);box-shadow:0 0 13px #3bd6ff99;pointer-events:none}\nbody.role-student .student-join-step.code-join-card{width:min(100%,860px)!important;min-height:490px!important;padding:26px clamp(20px,5vw,70px) 48px!important;margin:auto!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important}\nbody.role-student .code-join-card .join-step-icon{font-size:clamp(76px,10vw,120px)!important;line-height:1.08!important;filter:drop-shadow(0 0 18px #36b7ff88)!important;margin:6px auto 10px!important}\nbody.role-student .student-join-card h2{font-size:clamp(34px,5vw,64px)!important;line-height:1.06!important;color:#f5fcff!important;text-shadow:0 3px 18px #0ea3df44!important}\nbody.role-student .code-join-card p{font-size:clamp(16px,2vw,21px)!important;color:#bed8e8!important;max-width:630px!important}\nbody.role-student .join-code-field{width:min(100%,610px)!important;display:flex!important;gap:12px!important;align-items:stretch!important;margin:22px auto 10px!important}\nbody.role-student #joinCodeInput{min-height:76px!important;font-size:clamp(28px,5vw,42px)!important;letter-spacing:.18em!important;text-align:center!important;border:2px solid #65d7f5!important;background:#020c18!important;color:#fff!important;border-radius:18px!important;box-shadow:inset 0 0 22px #0b5c8140!important}\nbody.role-student #joinCodeBtn,body.role-student #joinClassBtn{min-height:70px!important;padding:16px 25px!important;border-radius:18px!important;background:linear-gradient(160deg,#ffe29e,#f49b30)!important;color:#171f2a!important;font-size:clamp(17px,2vw,22px)!important;font-weight:950!important;box-shadow:0 6px 0 #a75a1b,0 10px 25px #0007!important}\nbody.role-student .avatar-select-card{padding:25px clamp(18px,3vw,40px) 40px!important}\nbody.role-student .join-avatar-toolbar{gap:20px!important}\nbody.role-student .join-avatar-grid{grid-template-columns:repeat(auto-fit,minmax(138px,1fr))!important;gap:15px!important;max-height:none!important}\nbody.role-student .join-avatar-choice{min-height:174px!important;border:2px solid #34799f!important;border-radius:21px!important;background:linear-gradient(180deg,#10334d,#071825)!important;box-shadow:0 10px 21px #0005!important;transition:transform .15s ease,border-color .15s ease!important}\nbody.role-student .join-avatar-choice:hover{transform:translateY(-4px)!important;border-color:#ffd184!important}\nbody.role-student .confirm-join-card{max-width:800px!important;min-height:450px!important;margin:auto!important;padding:25px clamp(18px,4vw,54px) 45px!important}\nbody.role-student .join-confirm-hero{border:1px solid #469cbe!important;border-radius:23px!important;background:#0b2a40!important;padding:18px!important}\n@media(max-width:620px){body.role-student .device-main:has(.student-join-flow){padding:8px!important;min-height:0!important}body.role-student .student-join-flow{padding:3px!important}body.role-student .student-join-card{border-radius:21px!important}body.role-student .student-join-card:before{margin:0 0 14px!important;padding:12px 5px!important}body.role-student .student-join-step.code-join-card{min-height:420px!important;padding:15px 15px 37px!important}body.role-student .join-code-field{flex-direction:column!important}body.role-student #joinCodeInput{min-height:65px!important}body.role-student #joinCodeBtn{width:100%!important;min-height:60px!important}body.role-student .join-avatar-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}body.role-student .join-avatar-choice{min-height:142px!important}}\n</style>"
          s=s.replace('</head>',style+'\n</head>',1)
          assert s.count(marker)==1
          p.write_text(s,encoding='utf-8')
          print('Verified entry screens: code, avatar, confirmation. New bytes',p.stat().st_size)
          PY
          rm .github/workflows/one-shot-student-entry.yml
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-student-entry.yml
          git commit -m "Redesign Student Device join, avatar, and confirmation screens"
          git push origin HEAD:main
