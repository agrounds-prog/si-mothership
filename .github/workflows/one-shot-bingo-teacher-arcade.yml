name: One-shot Bingo teacher arcade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-bingo-teacher-arcade.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Visual-only Bingo teacher reskin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html');raw=p.read_bytes()
          def sha(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert sha(raw)=='2afe1af133d00fb1458f318fad1f0aa646db982a',f'Stale file {sha(raw)}'
          assert 1300000<len(raw)<1500000
          s=raw.decode('utf-8')
          for v in ('.bingo-teacher-grid','.bingo-teacher-card','.bingo-teacher-actions','.bingo-claims-list','.bingo-claim-row','.foundation-call','id="bingoCallNextBtn"','id="bingoRepeatBtn"','v77-bingo-mobile-game'):
            assert v in s,v
          assert 'v78-bingo-teacher-arcade' not in s
          css='''<style id="v78-bingo-teacher-arcade">
          /* Teacher Bingo visual skin only: scope all rules to Bingo's unique control. */
          #teacher #activityControllerPanel:has(#bingoCallNextBtn){
            position:relative;overflow:visible;
            border:1px solid rgba(89,181,255,.6)!important;
            border-radius:22px!important;
            padding:clamp(12px,2vw,22px)!important;
            background:radial-gradient(ellipse at 48% -10%,rgba(94,67,224,.32),transparent 48%),
              linear-gradient(145deg,#071b3b,#101338 55%,#071b2d)!important;
            box-shadow:0 16px 36px rgba(0,0,0,.35),inset 0 1px 0 rgba(150,227,255,.12);
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .activity-controller-head{
            padding:12px 16px!important;border-radius:16px!important;
            background:linear-gradient(105deg,rgba(18,75,157,.42),rgba(70,28,130,.22))!important;
            border:1px solid rgba(89,177,255,.28)!important;margin-bottom:14px!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .activity-controller-head h2{
            font-size:clamp(25px,3vw,38px)!important;font-weight:1000!important;
            color:#ffd66a!important;letter-spacing:.03em!important;
            text-shadow:0 3px 0 #75398f,0 0 16px rgba(255,176,78,.35)!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-teacher-grid{
            display:grid!important;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr)!important;
            align-items:start!important;gap:14px!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-teacher-card{
            min-width:0!important;padding:clamp(12px,1.8vw,20px)!important;
            border:1px solid rgba(58,165,249,.55)!important;border-radius:20px!important;
            background:linear-gradient(150deg,rgba(14,38,85,.97),rgba(9,20,49,.97))!important;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 9px 24px rgba(0,0,0,.26)!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-teacher-card h4{
            margin:0 0 12px!important;color:#8fe3ff!important;
            text-transform:uppercase!important;letter-spacing:.16em!important;
            font-size:clamp(11px,1.35vw,14px)!important;font-weight:900!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .foundation-call{
            position:relative!important;display:flex!important;align-items:center!important;
            justify-content:center!important;text-align:center!important;
            width:100%!important;min-height:clamp(170px,26vw,265px)!important;
            padding:22px!important;margin:0 0 16px!important;
            border:3px solid #38daff!important;border-radius:20px!important;
            background:radial-gradient(circle at 50% 34%,rgba(76,116,252,.52),transparent 57%),
              linear-gradient(160deg,#193875,#081a4e 65%,#240f59)!important;
            color:#fff!important;font-size:clamp(26px,4vw,56px)!important;
            font-weight:1000!important;line-height:1.05!important;overflow:hidden!important;
            text-shadow:0 3px 0 rgba(15,31,113,.8),0 0 22px rgba(87,190,255,.65)!important;
            box-shadow:inset 0 0 32px rgba(26,181,255,.22),0 0 21px rgba(39,175,255,.25)!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .foundation-call img{
            max-height:215px!important;max-width:100%!important;object-fit:contain!important;
            filter:drop-shadow(0 7px 12px rgba(0,0,0,.37));
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-teacher-actions{
            display:grid!important;grid-template-columns:1.5fr 1fr 1fr!important;gap:9px!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-teacher-actions button{
            min-height:54px!important;border-radius:14px!important;
            padding:10px 8px!important;font-weight:900!important;font-size:clamp(10px,1.3vw,14px)!important;
            line-height:1.2!important;white-space:normal!important;
            border:1px solid rgba(131,206,255,.48)!important;
            background:linear-gradient(180deg,#19447c,#0c2456)!important;
            box-shadow:0 4px 0 #06162f,0 7px 13px rgba(0,0,0,.25)!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) #bingoCallNextBtn{
            color:#fff!important;border-color:#9effba!important;
            background:linear-gradient(180deg,#28f078,#0aa748 70%,#077539)!important;
            box-shadow:0 4px 0 #074b2b,0 0 14px rgba(29,222,96,.32)!important;
            font-size:clamp(13px,1.65vw,18px)!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-teacher-actions button:disabled{
            opacity:.42!important;filter:saturate(.35)!important;cursor:not-allowed!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-history-grid{
            display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:7px!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-history-grid span{
            min-width:0!important;aspect-ratio:auto!important;min-height:58px!important;
            padding:7px!important;border:1px solid rgba(64,159,247,.38)!important;
            border-radius:11px!important;background:linear-gradient(140deg,#18396d,#102451)!important;
            color:#ecf9ff!important;font-size:clamp(9px,1vw,13px)!important;
            font-weight:900!important;overflow-wrap:anywhere!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-claims-list{
            display:grid!important;gap:10px!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-claim-row{
            grid-template-columns:minmax(0,1fr)!important;gap:11px!important;
            padding:13px!important;border-radius:15px!important;
            border:1px solid rgba(100,178,255,.4)!important;
            background:linear-gradient(140deg,#173460,#112044)!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-claim-row.valid{
            border-color:#ffd970!important;
            box-shadow:0 0 17px rgba(255,199,65,.19)!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-claim-row.invalid{
            border-color:#ff8695!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-claim-row-actions{
            display:flex!important;flex-wrap:wrap!important;gap:8px!important;
          }
          #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-claim-row-actions button{
            flex:1 1 110px!important;min-height:40px!important;border-radius:11px!important;
            font-weight:900!important;
          }
          @media(max-width:1000px){
            #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-teacher-grid{
              grid-template-columns:1fr!important;
            }
          }
          @media(max-width:580px){
            #teacher #activityControllerPanel:has(#bingoCallNextBtn) .bingo-teacher-actions{
              grid-template-columns:1fr 1fr!important;
            }
            #teacher #activityControllerPanel:has(#bingoCallNextBtn) #bingoCallNextBtn{
              grid-column:1/-1!important;
            }
          }
          </style>'''
          i=s.index('</head>');s=s[:i]+css+s[i:]
          p.write_text(s,encoding='utf-8')
          print('SOURCE_OK',sha(raw),'NEW_BLOB',sha(p.read_bytes()),'BYTES',p.stat().st_size)
          PY
          git diff --check
          rc=0
          python scripts/release_gate.py --require-node > /tmp/bingo-teacher-gate.log 2>&1 || rc=$?
          tail -n 8 /tmp/bingo-teacher-gate.log
          if [ "$rc" -ne 0 ]; then
            grep -Fxq 'Release gate: 396 passed, 1 failed.' /tmp/bingo-teacher-gate.log
            grep -Fxq ' - unified buttons v56.8: classroom art tiles match shortcut family' /tmp/bingo-teacher-gate.log
            grep -Fxq 'PASS  javascript: inline scripts parse' /tmp/bingo-teacher-gate.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reskin Bingo teacher caller with arcade controls"
          git push
