name: One-shot Word Grid Launch Recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-word-grid-launch-fix.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Fix real Word Grid start validation within Activity Library
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=r"""    $('#wgStart').onclick=()=>{const list=$('#wgPlayers').value.split(/\n|,/).map(s=>s.trim()).filter(Boolean);try{launchWordGridGame(window.WordGrid.make(list))}catch(e){toast(String(e.message||e))}};"""
          new=r"""    $('#wgStart').onclick=()=>{
              const names=$('#wgPlayers').value.split(/\n|,/).map(s=>s.trim()).filter(Boolean);
              const feedback=$('#wgSetupStatus');
              if(feedback)feedback.textContent='';
              if(names.length<2||names.length>4||new Set(names.map(n=>n.toLowerCase())).size!==names.length){
                const msg='Enter two to four different player or team names to start.';
                if(feedback)feedback.textContent=msg;
                $('#wgPlayers').focus();
                return;
              }
              try{launchWordGridGame(window.WordGrid.make(names))}
              catch(e){
                const msg=String(e?.message||e||'Word Grid could not start.');
                if(feedback)feedback.textContent=msg;
                toast(msg);
              }
            };"""
          assert s.count(old)==1,('stale Word Grid launch source',s.count(old))
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('Fixed Word Grid launch feedback. Source bytes:',p.stat().st_size)
          PY
          git diff --check
          python scripts/release_gate.py --require-node
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(word-grid): prevent one-player launch failures with clear setup errors'
          git push
