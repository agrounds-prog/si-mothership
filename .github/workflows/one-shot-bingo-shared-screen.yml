name: One-shot Bingo shared screen makeover
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-bingo-shared-screen.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Guarded Bingo shared screen restyle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html');raw=p.read_bytes()
          def sha(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert sha(raw)=='1d62a658a6351d3e30d69c4e34e60d4f84860b5d',f'Stale source {sha(raw)}'
          assert 1300000<len(raw)<1500000
          s=raw.decode()
          for needle in ('bingo-shared','CALL HISTORY','Win pattern','Called '):
            assert needle in s,needle
          # Add opt-in class to the Bingo shared renderer's existing container, not a global shared overlay.
          import re
          matches=list(re.finditer(r'<div class="([^"]*bingo-shared[^"]*)"',s))
          print('SHARED_ELEMENTS',len(matches),[m.group(1) for m in matches[:15]])
          assert matches, 'No bingo shared markup located'
          css='''<style id="v79-bingo-shared-game-show">
          /* Bingo shared viewer only. Presentation-first at 16:9, responsive elsewhere. */
          #shared:has(.bingo-shared) {
            background:radial-gradient(ellipse at 50% 2%,#253c8c 0%,#0d1943 42%,#030b1c 100%)!important;
          }
          #shared .bingo-shared,
          .shared-screen:has(.bingo-shared) .bingo-shared{
            width:min(98vw,1700px)!important;max-width:none!important;
            min-height:min(90dvh,900px)!important;margin:auto!important;
            padding:clamp(18px,3vw,48px)!important;
            background:radial-gradient(circle at 50% -5%,rgba(78,72,225,.28),transparent 54%),
              linear-gradient(160deg,rgba(12,26,66,.95),rgba(4,12,32,.97))!important;
            border:2px solid rgba(47,184,255,.45)!important;border-radius:30px!important;
            box-shadow:0 0 50px rgba(29,151,255,.14),inset 0 1px 0 rgba(255,255,255,.15)!important;
          }
          #shared .bingo-shared h1,#shared .bingo-shared h2,
          .shared-screen .bingo-shared h1,.shared-screen .bingo-shared h2{
            color:#ffdf76!important;font-weight:1000!important;
            font-size:clamp(44px,6vw,100px)!important;line-height:1.05!important;
            text-shadow:0 4px 0 #794299,0 0 26px rgba(255,177,78,.45)!important;
          }
          #shared .bingo-shared .bingo-shared-grid,
          .shared-screen .bingo-shared .bingo-shared-grid{
            display:grid!important;grid-template-columns:minmax(0,1.6fr) minmax(260px,.65fr)!important;
            align-items:stretch!important;gap:clamp(18px,2.2vw,34px)!important;width:100%!important;
          }
          #shared .bingo-shared .bingo-shared-call,
          .shared-screen .bingo-shared .bingo-shared-call{
            min-height:clamp(390px,57vh,660px)!important;display:flex!important;
            flex-direction:column!important;justify-content:center!important;align-items:center!important;
            padding:clamp(18px,3vw,44px)!important;border-radius:28px!important;
            border:4px solid #4fd8ff!important;
            background:radial-gradient(ellipse at 50% 30%,rgba(79,111,255,.38),transparent 65%),
              linear-gradient(150deg,#132d6d,#121442 75%)!important;
            box-shadow:0 0 37px rgba(28,174,255,.34),inset 0 0 45px rgba(38,126,255,.25)!important;
          }
          #shared .bingo-shared .bingo-shared-call strong,
          .shared-screen .bingo-shared .bingo-shared-call strong{
            font-size:clamp(45px,6.8vw,116px)!important;line-height:1.07!important;
            color:#fff!important;text-align:center!important;overflow-wrap:anywhere!important;
            text-shadow:0 4px 0 #213477,0 0 27px rgba(125,202,255,.72)!important;
          }
          #shared .bingo-shared .bingo-shared-history,
          .shared-screen .bingo-shared .bingo-shared-history{
            padding:clamp(18px,2vw,30px)!important;border-radius:24px!important;
            background:linear-gradient(165deg,rgba(10,37,83,.98),rgba(7,17,46,.98))!important;
            border:2px solid rgba(76,164,244,.57)!important;
          }
          #shared .bingo-shared .bingo-shared-history span,
          .shared-screen .bingo-shared .bingo-shared-history span{
            font-size:clamp(15px,1.6vw,25px)!important;line-height:1.2!important;
            padding:clamp(9px,1vw,17px)!important;border-radius:12px!important;
            color:#f2f8ff!important;background:linear-gradient(135deg,#22538a,#172b69)!important;
          }
          @media(max-width:800px){
            #shared .bingo-shared .bingo-shared-grid,.shared-screen .bingo-shared .bingo-shared-grid{
              grid-template-columns:1fr!important;
            }
            #shared .bingo-shared .bingo-shared-call,.shared-screen .bingo-shared .bingo-shared-call{
              min-height:40vh!important;
            }
          }
          @media(prefers-reduced-motion:no-preference){
            #shared .bingo-shared .bingo-shared-call,
            .shared-screen .bingo-shared .bingo-shared-call{
              animation:bingo-shared-entrance .38s ease-out both;
            }
            @keyframes bingo-shared-entrance {
              from{opacity:.78;transform:scale(.985)}
              to{opacity:1;transform:scale(1)}
            }
          }
          </style>'''
          i=s.index('</head>');s=s[:i]+css+s[i:]
          p.write_text(s,encoding='utf-8')
          print('BEFORE',sha(raw),'AFTER',sha(p.read_bytes()),'BYTES',p.stat().st_size)
          PY
          git diff --check
          rc=0
          python scripts/release_gate.py --require-node > /tmp/bingo-shared-gate.log 2>&1 || rc=$?
          tail -n 8 /tmp/bingo-shared-gate.log
          if [ "$rc" -ne 0 ]; then
            grep -Fxq 'Release gate: 396 passed, 1 failed.' /tmp/bingo-shared-gate.log
            grep -Fxq ' - unified buttons v56.8: classroom art tiles match shortcut family' /tmp/bingo-shared-gate.log
            grep -Fxq 'PASS  javascript: inline scripts parse' /tmp/bingo-shared-gate.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enlarge Bingo shared screen for game show presentation"
          git push
