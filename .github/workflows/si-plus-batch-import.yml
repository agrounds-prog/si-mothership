name: SI+ Batch Image Import Regression
on:
  push:
    branches: [main]
    paths: ['index.html','si-plus-polish.css','tests/test_si_plus_batch_browser.cjs','.github/workflows/si-plus-batch-import.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  si-plus-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Release gate and Python syntax
        run: |
          python scripts/release_gate.py --require-node
          python -m py_compile server.py
      - name: Install browser dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated classroom server
        run: |
          mkdir -p /tmp/mothership-si-plus-batch
          MOTHERSHIP_NO_BROWSER=1 MOTHERSHIP_DATA_DIR=/tmp/mothership-si-plus-batch PORT=8877 python server.py >/tmp/mothership-si-plus-batch.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8877/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -60 /tmp/mothership-si-plus-batch.log
          exit 1
      - name: Upload multiple images as slides, save, project, reset
        run: node tests/test_si_plus_batch_browser.cjs
      - name: Existing SI+ server persistence regression
        run: python -m unittest discover -s tests -p 'test_si_plus_persistence.py' -v
      - name: Failure logs
        if: failure()
        run: tail -120 /tmp/mothership-si-plus-batch.log || true
