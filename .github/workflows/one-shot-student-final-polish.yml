name: One-shot Student Device final polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-student-final-polish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final Student Device lobby and button polish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "ea448c0f25b86e37701a13beb254dd9a3599094c"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker='id="v61-student-lobby-final"'
          assert marker not in s
          block="<style id=\"v61-student-lobby-final\">\n/* Final Student Device lobby + controls override. Must remain last in main document head. */\nbody.role-student .cinematic-lobby>.cinematic-pilot-card{\n  display:flex!important;\n  flex-direction:column!important;\n  align-items:center!important;\n  justify-content:center!important;\n  width:min(100%,380px)!important;\n  min-width:0!important;\n  margin:18px auto 0!important;\n  padding:14px 14px 16px!important;\n  gap:10px!important;\n  text-align:center!important;\n  border:2px solid #40c8ef!important;\n  border-radius:28px!important;\n  background:\n    radial-gradient(circle at 50% 12%,rgba(80,211,255,.18),transparent 36%),\n    linear-gradient(180deg,#0a2a42,#051522)!important;\n  box-shadow:\n    inset 0 0 0 5px #020b13,\n    inset 0 0 0 6px rgba(115,232,255,.14),\n    0 18px 44px rgba(0,0,0,.42),\n    0 0 36px rgba(51,204,255,.22)!important;\n}\nbody.role-student .cinematic-lobby>.cinematic-pilot-card:before{\n  content:none!important;\n  display:none!important;\n}\nbody.role-student .cinematic-lobby .cinematic-pilot-card .student-avatar-mini{\n  order:1!important;\n  display:grid!important;\n  place-items:center!important;\n  width:min(74vw,290px)!important;\n  height:min(74vw,290px)!important;\n  max-width:290px!important;\n  max-height:290px!important;\n  margin:0 auto!important;\n  border:3px solid #7be9ff!important;\n  border-radius:25px!important;\n  overflow:hidden!important;\n  background:#03101b!important;\n  box-shadow:\n    inset 0 0 0 5px #020a12,\n    0 0 0 1px rgba(255,255,255,.18),\n    0 0 32px rgba(74,215,255,.32)!important;\n}\nbody.role-student .cinematic-lobby .cinematic-pilot-card .student-avatar-mini img{\n  width:100%!important;\n  height:100%!important;\n  max-width:none!important;\n  max-height:none!important;\n  object-fit:cover!important;\n  border-radius:19px!important;\n}\nbody.role-student .cinematic-lobby .cinematic-pilot-card>.student-avatar-mini+span{\n  order:2!important;\n  display:block!important;\n  width:100%!important;\n  margin:0!important;\n  padding:0!important;\n  color:#fff!important;\n  font-size:clamp(26px,7vw,36px)!important;\n  line-height:1.05!important;\n  font-weight:950!important;\n  letter-spacing:-.03em!important;\n  text-align:center!important;\n  text-shadow:0 0 18px rgba(83,218,255,.24)!important;\n}\n\n/* Brighter mission-control buttons, including waiting/disabled state. */\nbody.role-student .student-actions.home-controls{\n  grid-template-columns:repeat(2,minmax(0,1fr))!important;\n  gap:11px!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action]{\n  position:relative!important;\n  min-height:104px!important;\n  display:grid!important;\n  grid-template-columns:58px minmax(0,1fr)!important;\n  align-items:center!important;\n  gap:12px!important;\n  padding:13px!important;\n  border-width:2px!important;\n  border-style:solid!important;\n  border-radius:22px!important;\n  text-align:left!important;\n  overflow:hidden!important;\n  isolation:isolate!important;\n  opacity:1!important;\n  filter:none!important;\n  box-shadow:\n    inset 0 1px 0 rgba(255,255,255,.16),\n    inset 0 -14px 28px rgba(0,0,0,.16),\n    0 9px 20px rgba(0,0,0,.34)!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action]::before{\n  content:\"\"!important;\n  position:absolute!important;\n  left:-12%!important;\n  top:-70%!important;\n  width:70%!important;\n  height:190%!important;\n  transform:rotate(18deg)!important;\n  background:linear-gradient(90deg,transparent,rgba(255,255,255,.11),transparent)!important;\n  pointer-events:none!important;\n  z-index:-1!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action]::after{\n  content:\"\"!important;\n  position:absolute!important;\n  right:10px!important;\n  bottom:9px!important;\n  width:34px!important;\n  height:4px!important;\n  border-radius:999px!important;\n  background:currentColor!important;\n  opacity:.55!important;\n  box-shadow:0 0 12px currentColor!important;\n  pointer-events:none!important;\n}\nbody.role-student .student-actions.home-controls .student-command-icon{\n  width:56px!important;\n  height:56px!important;\n  display:grid!important;\n  place-items:center!important;\n  border:2px solid currentColor!important;\n  border-radius:50%!important;\n  background:rgba(2,10,18,.48)!important;\n  font-size:29px!important;\n  line-height:1!important;\n  color:inherit!important;\n  box-shadow:\n    inset 0 0 16px rgba(255,255,255,.09),\n    0 0 0 4px rgba(255,255,255,.025),\n    0 0 20px currentColor!important;\n}\nbody.role-student .student-actions.home-controls .student-command-copy{\n  min-width:0!important;\n  display:flex!important;\n  flex-direction:column!important;\n  gap:4px!important;\n}\nbody.role-student .student-actions.home-controls .student-command-copy b{\n  color:#fff!important;\n  font-size:17px!important;\n  line-height:1.05!important;\n  font-weight:950!important;\n  letter-spacing:-.01em!important;\n}\nbody.role-student .student-actions.home-controls .student-command-copy small{\n  color:#d4e5ef!important;\n  font-size:10px!important;\n  line-height:1.25!important;\n  font-weight:750!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action=\"ready\"]{\n  color:#5affc2!important;\n  border-color:#2ddc9c!important;\n  background:\n    radial-gradient(circle at 17% 50%,rgba(53,255,188,.30),transparent 32%),\n    linear-gradient(145deg,#0c4739,#09252d 62%,#06171f)!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action=\"hand\"]{\n  color:#ffd15c!important;\n  border-color:#e6a936!important;\n  background:\n    radial-gradient(circle at 17% 50%,rgba(255,194,57,.31),transparent 32%),\n    linear-gradient(145deg,#5a390b,#2a2718 62%,#10181e)!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action=\"help\"]{\n  color:#c17cff!important;\n  border-color:#a05cf0!important;\n  background:\n    radial-gradient(circle at 17% 50%,rgba(188,92,255,.31),transparent 32%),\n    linear-gradient(145deg,#3f1c5d,#241a3b 62%,#101522)!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action=\"buzz\"]{\n  color:#ff66c9!important;\n  border-color:#f34cac!important;\n  background:\n    radial-gradient(circle at 17% 50%,rgba(255,80,190,.31),transparent 32%),\n    linear-gradient(145deg,#561541,#2f1735 62%,#111522)!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action=\"picture\"]{\n  grid-column:1/-1!important;\n  color:#64dfff!important;\n  border-color:#3bb9ef!important;\n  background:\n    radial-gradient(circle at 10% 50%,rgba(61,198,255,.30),transparent 26%),\n    linear-gradient(145deg,#0b4262,#0a2942 62%,#071824)!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action]:disabled{\n  opacity:.82!important;\n  filter:saturate(.92) brightness(.92)!important;\n  cursor:default!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action].on{\n  opacity:1!important;\n  filter:saturate(1.18) brightness(1.08)!important;\n  box-shadow:\n    inset 0 1px 0 rgba(255,255,255,.18),\n    inset 0 -14px 28px rgba(0,0,0,.12),\n    0 9px 20px rgba(0,0,0,.34),\n    0 0 28px color-mix(in srgb,currentColor 40%,transparent)!important;\n}\n@media(max-width:520px){\n  body.role-student .cinematic-lobby>.cinematic-pilot-card{width:min(100%,350px)!important;padding:12px 12px 14px!important}\n  body.role-student .cinematic-lobby .cinematic-pilot-card .student-avatar-mini{width:min(78vw,272px)!important;height:min(78vw,272px)!important}\n  body.role-student .student-actions.home-controls{gap:9px!important}\n  body.role-student .student-actions.home-controls button[data-class-action]{\n    min-height:98px!important;\n    grid-template-columns:50px minmax(0,1fr)!important;\n    gap:9px!important;\n    padding:11px 10px!important;\n    border-radius:19px!important;\n  }\n  body.role-student .student-actions.home-controls .student-command-icon{width:48px!important;height:48px!important;font-size:25px!important}\n  body.role-student .student-actions.home-controls .student-command-copy b{font-size:15px!important}\n  body.role-student .student-actions.home-controls .student-command-copy small{font-size:9px!important}\n}\n</style>"
          pos=s.index("</head>")
          s=s[:pos]+block+"\n"+s[pos:]
          assert s.count(marker)==1
          assert s.index(marker)<s.index("</head>")
          p.write_text(s,encoding="utf-8")
          print("bytes",p.stat().st_size,"style_before_head",s.index(marker)<s.index("</head>"))
          PY
          rm -f .github/workflows/one-shot-student-final-polish.yml
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-student-final-polish.yml
          git commit -m 'Polish Student Device avatar and command buttons'
          git push origin HEAD:main
