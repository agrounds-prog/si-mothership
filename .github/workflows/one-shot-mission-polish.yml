name: One-shot Mission Control readability polish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-mission-polish.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Guarded CSS patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html')
          raw=p.read_bytes()
          digest=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert digest=='5a8bd0ba1e70ccc81dedab4e9b56f4581c362475',f'Unexpected source blob {digest}'
          assert len(raw)==1328837,f'Unexpected source length {len(raw)}'
          s=raw.decode('utf-8')
          marker='id="v57-mission-control-readability"'
          assert marker not in s
          css='''<style id="v57-mission-control-readability">
          /* Mission Control typography/accessibility polish; visuals only. */
          #teacher .teacher-controlbar .control{min-height:56px!important;padding:9px 5px!important;gap:7px!important}
          #teacher .teacher-controlbar .control .ico{width:23px!important;height:23px!important;flex-basis:23px!important;font-size:14px!important}
          #teacher .teacher-controlbar .control b{font-size:11px!important;line-height:1.25!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;overflow-wrap:break-word}
          #teacher .control-group-label{font-size:10px!important;line-height:1.3!important}
          #teacher .session-group .session-summary-btn,#teacher .session-group .session-history-btn,#teacher .session-group .emergency-btn,#teacher .session-group .end-btn{min-height:56px!important;font-size:11px!important;line-height:1.25!important}
          #teacher .teacher-controlbar .control:focus-visible,#teacher .session-group button:focus-visible{outline:2px solid #9fe4f4!important;outline-offset:2px!important}
          @media(max-width:1050px){#teacher .teacher-controlbar .control b{font-size:10px!important}}
          </style>
          '''
          pos=s.index('</head>')
          s=s[:pos]+css+s[pos:]
          assert s.count(marker)==1 and s.index(marker)<s.index('</head>')
          assert len(s.encode('utf-8'))>len(raw)
          p.write_text(s,encoding='utf-8')
          print('SOURCE_OK',digest,'NEW_BYTES',p.stat().st_size,'MARKER_OK')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish Mission Control control readability"
          git push
