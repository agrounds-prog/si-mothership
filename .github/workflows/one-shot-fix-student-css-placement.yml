name: One-shot fix Student Device CSS placement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-student-css-placement.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Move Student Device concept CSS into real document head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "5fea877db5db706364b79b649117ed093d668e8b"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.index('<style id="v60-student-concept-live">')
          end=s.index('</style>',start)+len('</style>')
          block=s[start:end]
          assert s.count('id="v60-student-concept-live"')==1
          first_head_close=s.index('</head>')
          assert first_head_close < start, (first_head_close,start)
          s=s[:start]+s[end:]
          first_head_close=s.index('</head>')
          s=s[:first_head_close]+block+'\n'+s[first_head_close:]
          old='<meta name="viewport" content="width=device-width, initial-scale=1" />'
          if old in s:
              s=s.replace(old,'<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />',1)
          assert s.index('id="v60-student-concept-live"') < s.index('</head>')
          assert s.count('id="v60-student-concept-live"')==1
          assert s.count('student-command-icon')>=7
          p.write_text(s,encoding="utf-8")
          print("main_head_close",s.index('</head>'),"style",s.index('id="v60-student-concept-live"'),"bytes",p.stat().st_size)
          PY
          rm -f .github/workflows/one-shot-fix-student-css-placement.yml
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-fix-student-css-placement.yml
          git diff --cached --stat
          git commit -m 'Fix Student Device concept styles on live page'
          git push origin HEAD:main
