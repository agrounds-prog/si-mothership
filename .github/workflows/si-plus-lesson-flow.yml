name: SI+ Lesson Flow Regression
on:
  push:
    branches: [main]
    paths:
      - 'si-plus-polish.js'
      - 'si-plus-polish.css'
      - 'quick-poll.js'
      - 'quick-poll.css'
      - 'server.py'
      - 'tests/test_si_plus_activity_break_browser.cjs'
      - 'tests/test_si_plus_quick_poll_bridge_browser.cjs'
      - '.github/workflows/si-plus-lesson-flow.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  lesson-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify presentation assets and server
        run: |
          node --check si-plus-polish.js
          node --check quick-poll.js
          python -m py_compile server.py
      - name: Install browser dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated lesson classroom
        run: |
          mkdir -p /tmp/si-plus-lesson-flow
          MOTHERSHIP_NO_BROWSER=1 MOTHERSHIP_DATA_DIR=/tmp/si-plus-lesson-flow PORT=8877 python server.py > /tmp/si-plus-lesson-flow.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8877/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -70 /tmp/si-plus-lesson-flow.log
          exit 1
      - name: SI+ in-lesson Quick Poll handoff and answer privacy
        run: node tests/test_si_plus_quick_poll_bridge_browser.cjs
      - name: SI+ game break, direct poll, exact-slide restore and reload
        run: node tests/test_si_plus_activity_break_browser.cjs
      - name: Classroom failure diagnostics
        if: failure()
        run: tail -120 /tmp/si-plus-lesson-flow.log || true
