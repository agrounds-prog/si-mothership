name: One-shot Teacher roster response signals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-roster-response-signals.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add Teacher roster response signals
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "00558613947bb78d48b02da2d2cc4a74bc50c3cc"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="    const showResponseNote=!!resp&&!(state.promptActive&&['ready','emotion','understanding'].includes(state.screen));\n    const signalMarkup=`${buzzed?`<em class=\"buzz-chip\">ϟ BUZZ ${buzzIndex+1}</em>`:''}${hand?'<em class=\"hand-chip\">✋ HAND</em>':''}${help?'<em class=\"help-chip\">? HELP</em>':''}`;\n    return `<div class=\"crew ${s.offline?'offline':''} ${readyGlow?'ready-glow':''} ${boardGlow?'board-control-glow':''} ${hand?'hand-raised-glow':''} ${buzzed?'buzz-glow':''} ${buzzIndex===0?'buzz-first':''}\" style=\"--c:${s.c}\"><div class=\"crew-avatar-stage\"><div class=\"stem\"></div><div class=\"bot-card ${String(s.avatarKey||'').startsWith('custom_')?'custom-avatar-card':''}\">${avatarRosterMarkup(s)}</div>${sparseSignals?'':signalMarkup}</div><b>${s.n}</b><small>${s.offline?'Reconnecting':'Connected'}</small>${pill}${showResponseNote?`<span class=\"response-note\">${esc(resp)}</span>`:''}${sparseSignals?`<div class=\"crew-signal-dock ${signalMarkup?'active':'quiet'}\">${signalMarkup||'<span class=\"crew-signal-clear\">NO ACTIVE ALERTS</span>'}</div>`:''}</div>`;"
          new="    const showResponseNote=!!resp&&!(state.promptActive&&['ready','emotion','understanding'].includes(state.screen));\n    const signalMarkup=`${buzzed?`<em class=\"buzz-chip\">ϟ BUZZ ${buzzIndex+1}</em>`:''}${hand?'<em class=\"hand-chip\">✋ HAND</em>':''}${help?'<em class=\"help-chip\">? HELP</em>':''}`;\n    const photoSent=state.photos.some(p=>p.name===s.n);\n    const responseSignals=[];\n    if(!activity&&s.readyResponse&&!(state.promptActive&&state.screen==='ready'))responseSignals.push(`<span class=\"roster-response-chip ready-state\">${s.readyResponse==='Ready'?'✓ READY':'! NOT YET'}</span>`);\n    if(!activity&&s.emotion&&!(state.promptActive&&state.screen==='emotion'))responseSignals.push(`<span class=\"roster-response-chip emotion-state\">♡ ${esc(s.emotion).toUpperCase()}</span>`);\n    if(!activity&&s.understanding&&!(state.promptActive&&state.screen==='understanding'))responseSignals.push(`<span class=\"roster-response-chip understanding-state\">▥ ${esc(s.understanding).toUpperCase()}</span>`);\n    if(!activity&&photoSent&&!(state.screen==='picture'&&state.picturePromptSent))responseSignals.push('<span class=\"roster-response-chip photo-state\">📷 PHOTO</span>');\n    const responseStrip=responseSignals.length?`<div class=\"roster-response-strip\">${responseSignals.join('')}</div>`:'';\n    return `<div class=\"crew ${s.offline?'offline':''} ${readyGlow?'ready-glow':''} ${boardGlow?'board-control-glow':''} ${hand?'hand-raised-glow':''} ${buzzed?'buzz-glow':''} ${buzzIndex===0?'buzz-first':''}\" style=\"--c:${s.c}\"><div class=\"crew-avatar-stage\"><div class=\"stem\"></div><div class=\"bot-card ${String(s.avatarKey||'').startsWith('custom_')?'custom-avatar-card':''}\">${avatarRosterMarkup(s)}</div>${sparseSignals?'':signalMarkup}</div><b>${s.n}</b><small>${s.offline?'Reconnecting':'Connected'}</small>${pill}${responseStrip}${showResponseNote?`<span class=\"response-note\">${esc(resp)}</span>`:''}${sparseSignals?`<div class=\"crew-signal-dock ${signalMarkup?'active':'quiet'}\">${signalMarkup||'<span class=\"crew-signal-clear\">NO ACTIVE ALERTS</span>'}</div>`:''}</div>`;"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          marker='id="v72-teacher-roster-response-signals"'
          assert marker not in s
          block="<style id=\"v72-teacher-roster-response-signals\">\n#teacher .roster-response-strip{\n  width:100%!important;\n  max-width:190px!important;\n  margin:6px auto 0!important;\n  display:flex!important;\n  flex-wrap:wrap!important;\n  justify-content:center!important;\n  gap:4px!important;\n}\n#teacher .roster-response-chip{\n  min-height:18px!important;\n  display:inline-flex!important;\n  align-items:center!important;\n  justify-content:center!important;\n  padding:3px 6px!important;\n  border:1px solid #344b5e!important;\n  border-radius:999px!important;\n  background:#0b1925!important;\n  color:#9eb3c5!important;\n  font-size:6.5px!important;\n  font-weight:950!important;\n  line-height:1!important;\n  letter-spacing:.055em!important;\n  white-space:nowrap!important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.035)!important;\n}\n#teacher .roster-response-chip.ready-state{\n  border-color:#3f936d!important;\n  background:#0d2b22!important;\n  color:#8ff0bc!important;\n}\n#teacher .roster-response-chip.emotion-state{\n  border-color:#8060a6!important;\n  background:#21162f!important;\n  color:#d0a8f2!important;\n}\n#teacher .roster-response-chip.understanding-state{\n  border-color:#397995!important;\n  background:#0b2534!important;\n  color:#8eddf5!important;\n}\n#teacher .roster-response-chip.photo-state{\n  border-color:#3288a5!important;\n  background:#092937!important;\n  color:#75e3ff!important;\n}\n#teacher .roster-card.sparse-roster .roster-response-strip{\n  max-width:220px!important;\n  margin-top:7px!important;\n  gap:5px!important;\n}\n#teacher .roster-card.sparse-roster .roster-response-chip{\n  min-height:20px!important;\n  padding:4px 7px!important;\n  font-size:7px!important;\n}\n#teacher .roster-card.sparse-roster .avatar-line:not(:has(.crew:nth-child(3))) .roster-response-strip{\n  grid-area:note!important;\n  justify-self:start!important;\n  justify-content:flex-start!important;\n  max-width:180px!important;\n  margin:4px 0 0!important;\n}\n#teacher .roster-card.sparse-roster .avatar-line:not(:has(.crew:nth-child(3))) .roster-response-strip + .response-note{\n  margin-top:4px!important;\n}\n@media(max-width:900px){\n  #teacher .roster-card.sparse-roster .avatar-line:not(:has(.crew:nth-child(3))) .roster-response-strip{\n    justify-self:auto!important;\n    justify-content:center!important;\n    margin:6px auto 0!important;\n  }\n}\n</style>"
          pos=s.index("</head>")
          s=s[:pos]+block+"\n"+s[pos:]
          assert s.count(marker)==1
          assert s.index(marker)<s.index("</head>")
          p.write_text(s,encoding="utf-8")
          print("bytes",p.stat().st_size)
          PY
          rm -f .github/workflows/one-shot-roster-response-signals.yml
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-roster-response-signals.yml
          git commit -m 'Add Teacher roster response signals'
          git push origin HEAD:main
