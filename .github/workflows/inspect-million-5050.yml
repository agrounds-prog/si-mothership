name: Inspect MILLION 50-50
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-million-5050.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dump lifeline rendering and click handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text().splitlines()
          for a,b in [(15656,15691),(17361,17387),(17458,17537),(18005,18075),(18340,18440)]:
           print('==== SEGMENT',a,b)
           for i in range(a-1,b):print(f'{i+1}: {s[i][:2400]}')
          for i,line in enumerate(s):
           if 'millionLife' in line or 'millionUseLifeline(' in line or 'data-million-life-use' in line or 'million-choice.eliminated' in line:
            if i+1<15000:continue
            print('==== MATCH',i+1)
            for j in range(max(0,i-2),min(len(s),i+4)):print(f'{j+1}: {s[j][:2000]}')
          PY