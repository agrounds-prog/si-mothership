name: One-shot Student Help feedback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-help-feedback.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Polish Student Help feedback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "6848fe07fc6fbb347d64fbb74ab85d7718a04165"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="<button data-class-action=\"help\" class=\"${(state.helpMessages||[]).some(m=>m.name===s.n&&!(state.helpDeletedIds||[]).includes(String(m.id)))?'on':''}\" ${!state.helpEnabled||homeLocked?'disabled':''}><span class=\"student-command-icon\">?</span><span class=\"student-command-copy\"><b>Ask for Help</b><small>Send a help request</small></span></button>"
          new="<button data-class-action=\"help\" class=\"${(state.helpMessages||[]).some(m=>m.name===s.n&&!(state.helpDeletedIds||[]).includes(String(m.id)))?'on':''}\" ${!state.helpEnabled||homeLocked?'disabled':''}><span class=\"student-command-icon\">${(state.helpMessages||[]).some(m=>m.name===s.n&&!(state.helpDeletedIds||[]).includes(String(m.id)))?'✓':'?'}</span><span class=\"student-command-copy\"><b>${(state.helpMessages||[]).some(m=>m.name===s.n&&!(state.helpDeletedIds||[]).includes(String(m.id)))?'Help Sent':'Ask for Help'}</b><small>${(state.helpMessages||[]).some(m=>m.name===s.n&&!(state.helpDeletedIds||[]).includes(String(m.id)))?'Teacher has your request':'Send a help request'}</small></span></button>"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          marker='id="v68-student-help-feedback"'
          assert marker not in s
          block="<style id=\"v68-student-help-feedback\">\nbody.role-student .student-actions.home-controls button[data-class-action=\"help\"].on{\n  color:#e1b0ff!important;\n  border-color:#c77cff!important;\n  background:\n    radial-gradient(circle at 18% 50%,rgba(205,111,255,.58),transparent 30%),\n    radial-gradient(circle at 86% 0%,rgba(234,177,255,.20),transparent 36%),\n    linear-gradient(145deg,#6a2a91,#442559 58%,#261a32)!important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 10px 24px rgba(0,0,0,.38),0 0 30px rgba(199,124,255,.48)!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action=\"help\"].on .student-command-icon{\n  color:#fff!important;\n  border-color:#e5bdff!important;\n  background:rgba(75,20,103,.72)!important;\n  box-shadow:0 0 18px #ce8bff,0 0 36px rgba(199,124,255,.55)!important;\n}\nbody.role-student .help-composer{\n  padding:14px!important;\n  background:rgba(3,7,18,.90)!important;\n  backdrop-filter:blur(12px)!important;\n}\nbody.role-student .help-composer-card{\n  width:min(540px,94vw)!important;\n  padding:18px!important;\n  border:2px solid #b06cff!important;\n  border-radius:24px!important;\n  background:\n    radial-gradient(circle at 50% 0%,rgba(176,108,255,.20),transparent 35%),\n    linear-gradient(155deg,#211333,#111323 72%,#0b101c)!important;\n  box-shadow:inset 0 0 0 5px #080612,0 28px 90px rgba(0,0,0,.72),0 0 34px rgba(176,108,255,.22)!important;\n}\nbody.role-student .help-composer-head b{\n  color:#fff!important;\n  font-size:22px!important;\n}\nbody.role-student .help-composer-head small{\n  color:#d2b9e5!important;\n  font-size:12px!important;\n}\nbody.role-student .help-composer-head button{\n  border-color:#79529b!important;\n  background:#261837!important;\n  color:#f0dfff!important;\n}\nbody.role-student #helpComposerText{\n  min-height:150px!important;\n  border:2px solid #744d96!important;\n  border-radius:16px!important;\n  background:#0d1020!important;\n  color:#fbf7ff!important;\n  box-shadow:inset 0 0 22px rgba(176,108,255,.08)!important;\n  font-size:16px!important;\n}\nbody.role-student #helpComposerText:focus{\n  outline:none!important;\n  border-color:#c77cff!important;\n  box-shadow:0 0 0 3px rgba(199,124,255,.15),inset 0 0 22px rgba(176,108,255,.08)!important;\n}\nbody.role-student .help-composer-actions{\n  gap:10px!important;\n  margin-top:14px!important;\n}\nbody.role-student .help-composer-actions button{\n  min-height:46px!important;\n  padding:11px 16px!important;\n  border-radius:12px!important;\n}\nbody.role-student #helpComposerCancel{\n  border-color:#485166!important;\n  background:#161b28!important;\n  color:#d8dfeb!important;\n}\nbody.role-student #helpComposerSend{\n  border:2px solid #c77cff!important;\n  background:linear-gradient(145deg,#6b2c91,#45245b)!important;\n  color:#f4dcff!important;\n  box-shadow:0 0 22px rgba(199,124,255,.28)!important;\n}\n@media(max-width:520px){\n  body.role-student .help-composer-card{padding:14px!important;border-radius:20px!important}\n  body.role-student .help-composer-head b{font-size:19px!important}\n  body.role-student #helpComposerText{min-height:128px!important;font-size:15px!important}\n  body.role-student .help-composer-actions button{min-height:42px!important;padding:9px 12px!important}\n}\n</style>"
          pos=s.index("</head>")
          s=s[:pos]+block+"\n"+s[pos:]
          assert s.count(marker)==1
          assert s.index(marker)<s.index("</head>")
          p.write_text(s,encoding="utf-8")
          print("bytes",p.stat().st_size)
          PY
          rm -f .github/workflows/one-shot-help-feedback.yml
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-help-feedback.yml
          git commit -m 'Polish Student Help feedback'
          git push origin HEAD:main
