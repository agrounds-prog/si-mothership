name: One-shot Student Classroom Agenda redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-classroom-agenda-redesign.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Redesign Student Classroom and Agenda
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "2e900fe95a10be71ff0067d7b6e4665b0c6843f9"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          anchor="function studentMarkup(){"
          assert s.count(anchor)==1
          helper="function studentAgendaMarkup(){\n  const p=state.published||{};\n  if(p.mode==='image'&&p.image)return `<div class=\"student-prompt agenda-live-surface agenda-image-surface\"><div class=\"agenda-live-head\"><span class=\"eyebrow\">AGENDA · IMAGE</span><span class=\"agenda-live-chip\">LIVE</span></div><div class=\"agenda-image-frame\"><img src=\"${p.image}\" alt=\"Agenda image\"></div><div class=\"agenda-live-footer\"><span>Shared by your teacher</span></div></div>`;\n  if(p.mode==='youtube'&&ytId(p.youtube)){const id=ytId(p.youtube);return `<div class=\"student-prompt agenda-live-surface agenda-video-surface\"><div class=\"agenda-live-head\"><span class=\"eyebrow\">AGENDA · VIDEO</span><span class=\"agenda-live-chip\">LIVE</span></div><div class=\"agenda-video-frame\"><iframe src=\"${ytEmbed(id,true)}\" allow=\"autoplay; encrypted-media; picture-in-picture; fullscreen\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\"></iframe></div><a class=\"agenda-video-fallback\" href=\"${ytWatch(id)}\" target=\"_blank\" rel=\"noopener\">Open video on YouTube ↗</a></div>`;}\n  return `<div class=\"student-prompt agenda-live-surface agenda-text-surface\"><div class=\"agenda-live-head\"><span class=\"eyebrow\">AGENDA</span><span class=\"agenda-live-chip\">LIVE</span></div><div class=\"agenda-text-console\">${esc(p.text||'')}</div><div class=\"agenda-live-footer\"><span>Follow along with your teacher</span></div></div>`;\n}\n\n"
          s=s.replace(anchor,helper+anchor,1)
          old="if(state.screen==='agenda'&&state.agendaLive)return sharedMarkup('big');"
          new="if(state.screen==='agenda'&&state.agendaLive)return studentAgendaMarkup();"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          marker='id="v70-student-classroom-agenda"'
          assert marker not in s
          block="<style id=\"v70-student-classroom-agenda\">\nbody.role-student .cinematic-classroom{\n  width:min(100%,680px)!important;\n  padding:24px!important;\n  border:2px solid #38c9f0!important;\n  border-radius:28px!important;\n  background:\n    radial-gradient(circle at 70% 0%,rgba(62,203,255,.18),transparent 32%),\n    linear-gradient(180deg,#0a2940,#061624 72%,#04111c)!important;\n  box-shadow:inset 0 0 0 6px #020b13,inset 0 0 0 7px rgba(104,226,255,.10),0 22px 48px rgba(0,0,0,.42),0 0 32px rgba(51,202,255,.13)!important\n}\nbody.role-student .cinematic-classroom-grid{\n  gap:20px!important;\n  align-items:center!important\n}\nbody.role-student .cinematic-classroom .cinematic-pilot-card{\n  border-color:#38c9f0!important;\n  box-shadow:inset 0 0 0 4px #020b13,0 0 22px rgba(56,201,240,.18)!important\n}\nbody.role-student .cinematic-message-console{\n  padding:18px!important;\n  border:1px solid rgba(93,213,244,.30)!important;\n  border-radius:20px!important;\n  background:rgba(4,19,31,.72)!important;\n  text-align:left!important\n}\nbody.role-student .cinematic-message-console h2{\n  margin:8px 0 7px!important;\n  color:#fff!important;\n  font-size:clamp(30px,6.5vw,46px)!important;\n  line-height:1!important\n}\nbody.role-student .cinematic-message-console p{\n  margin:0!important;\n  color:#c6dce8!important;\n  font-size:15px!important;\n  line-height:1.4!important\n}\nbody.role-student .agenda-live-surface{\n  width:min(100%,720px)!important;\n  max-width:720px!important;\n  padding:20px!important;\n  border:2px solid #43cfff!important;\n  border-radius:28px!important;\n  background:\n    radial-gradient(circle at 50% 0%,rgba(67,207,255,.18),transparent 34%),\n    linear-gradient(180deg,#09283e,#061522 74%,#04101a)!important;\n  box-shadow:inset 0 0 0 6px #020b13,inset 0 0 0 7px rgba(104,226,255,.10),0 22px 48px rgba(0,0,0,.42),0 0 32px rgba(67,207,255,.14)!important\n}\nbody.role-student .agenda-live-head{\n  display:flex!important;\n  align-items:center!important;\n  justify-content:space-between!important;\n  gap:12px!important;\n  margin-bottom:16px!important\n}\nbody.role-student .agenda-live-head .eyebrow{\n  color:#8feeff!important;\n  font-size:11px!important;\n  letter-spacing:.20em!important\n}\nbody.role-student .agenda-live-chip{\n  display:inline-flex!important;\n  align-items:center!important;\n  justify-content:center!important;\n  min-height:24px!important;\n  padding:4px 9px!important;\n  border:1px solid #38e6a9!important;\n  border-radius:999px!important;\n  background:#0c3a31!important;\n  color:#79ffd8!important;\n  font-size:9px!important;\n  font-weight:950!important;\n  letter-spacing:.14em!important;\n  box-shadow:0 0 16px rgba(56,230,169,.22)!important\n}\nbody.role-student .agenda-text-console{\n  min-height:180px!important;\n  display:flex!important;\n  align-items:center!important;\n  justify-content:center!important;\n  padding:24px!important;\n  border:1px solid rgba(111,230,255,.30)!important;\n  border-radius:20px!important;\n  background:rgba(4,18,30,.78)!important;\n  color:#f6fbff!important;\n  white-space:pre-wrap!important;\n  font-size:clamp(22px,5vw,34px)!important;\n  line-height:1.38!important;\n  text-align:center!important\n}\nbody.role-student .agenda-image-frame{\n  width:100%!important;\n  display:grid!important;\n  place-items:center!important;\n  padding:10px!important;\n  border:1px solid rgba(111,230,255,.30)!important;\n  border-radius:20px!important;\n  background:#03101a!important;\n  overflow:hidden!important\n}\nbody.role-student .agenda-image-frame img{\n  display:block!important;\n  width:100%!important;\n  max-height:58vh!important;\n  object-fit:contain!important;\n  border-radius:14px!important\n}\nbody.role-student .agenda-video-frame{\n  width:100%!important;\n  overflow:hidden!important;\n  border:1px solid rgba(111,230,255,.30)!important;\n  border-radius:20px!important;\n  background:#02070d!important;\n  box-shadow:0 0 22px rgba(67,207,255,.12)!important\n}\nbody.role-student .agenda-video-frame iframe{\n  display:block!important;\n  width:100%!important;\n  aspect-ratio:16/9!important;\n  border:0!important\n}\nbody.role-student .agenda-video-fallback{\n  display:inline-block!important;\n  margin-top:12px!important;\n  color:#8feeff!important;\n  font-size:11px!important;\n  font-weight:850!important;\n  text-decoration:none!important\n}\nbody.role-student .agenda-live-footer{\n  margin-top:12px!important;\n  color:#9ebdcd!important;\n  font-size:11px!important;\n  letter-spacing:.03em!important\n}\n@media(max-width:520px){\n  body.role-student .device-main:has(.cinematic-classroom),\n  body.role-student .device-main:has(.agenda-live-surface){\n    padding:8px 7px 10px!important;\n    min-height:0!important;\n    align-items:flex-start!important\n  }\n  body.role-student .cinematic-classroom{\n    padding:14px 11px!important;\n    border-radius:22px!important\n  }\n  body.role-student .cinematic-classroom-grid{\n    grid-template-columns:96px 1fr!important;\n    gap:10px!important\n  }\n  body.role-student .cinematic-classroom .cinematic-pilot-card{\n    width:96px!important;\n    padding:6px!important;\n    margin:0!important\n  }\n  body.role-student .cinematic-classroom .cinematic-pilot-card .student-avatar-mini{\n    width:82px!important;\n    height:82px!important\n  }\n  body.role-student .cinematic-classroom .cinematic-pilot-card>.student-avatar-mini+span{\n    font-size:13px!important\n  }\n  body.role-student .cinematic-message-console{\n    padding:12px!important;\n    border-radius:16px!important\n  }\n  body.role-student .cinematic-message-console h2{\n    font-size:25px!important;\n    margin:5px 0!important\n  }\n  body.role-student .cinematic-message-console p{\n    font-size:12px!important\n  }\n  body.role-student .agenda-live-surface{\n    padding:13px!important;\n    border-radius:22px!important\n  }\n  body.role-student .agenda-live-head{\n    margin-bottom:10px!important\n  }\n  body.role-student .agenda-text-console{\n    min-height:150px!important;\n    padding:17px 13px!important;\n    font-size:22px!important;\n    border-radius:16px!important\n  }\n  body.role-student .agenda-image-frame,\n  body.role-student .agenda-video-frame{\n    border-radius:16px!important\n  }\n  body.role-student .agenda-image-frame img{\n    max-height:48vh!important\n  }\n}\n</style>"
          pos=s.index("</head>")
          s=s[:pos]+block+"\n"+s[pos:]
          assert s.count(marker)==1
          assert s.index(marker)<s.index("</head>")
          p.write_text(s,encoding="utf-8")
          print("bytes",p.stat().st_size)
          PY
          rm -f .github/workflows/one-shot-classroom-agenda-redesign.yml
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-classroom-agenda-redesign.yml
          git commit -m 'Redesign Student Classroom and Agenda'
          git push origin HEAD:main
