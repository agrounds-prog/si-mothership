name: One-shot Student Hand Buzz feedback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-hand-buzz-feedback.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Polish Student Hand and Buzz feedback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "5a62f913d5283168922d1fd5a153fd90f22f0859"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          pairs=[("<button data-class-action=\"hand\" class=\"${state.alerts.some(a=>a.type==='hand'&&a.name===s.n)?'on':''}\" ${!state.handEnabled||homeLocked?'disabled':''}><span class=\"student-command-icon\">✋</span><span class=\"student-command-copy\"><b>Raise Hand</b><small>Get the teacher’s attention</small></span></button>","<button data-class-action=\"hand\" class=\"${state.alerts.some(a=>a.type==='hand'&&a.name===s.n)?'on':''}\" ${!state.handEnabled||homeLocked?'disabled':''}><span class=\"student-command-icon\">${state.alerts.some(a=>a.type==='hand'&&a.name===s.n)?'✓':'✋'}</span><span class=\"student-command-copy\"><b>${state.alerts.some(a=>a.type==='hand'&&a.name===s.n)?'Hand Raised':'Raise Hand'}</b><small>${state.alerts.some(a=>a.type==='hand'&&a.name===s.n)?'Teacher has your signal':'Get the teacher’s attention'}</small></span></button>"),("<button data-class-action=\"buzz\" class=\"${state.buzz.includes(s.n)?'on':''}\" ${!state.buzzEnabled||homeLocked?'disabled':''}><span class=\"student-command-icon\">⚡</span><span class=\"student-command-copy\"><b>Buzz In</b><small>Jump into the discussion</small></span></button>","<button data-class-action=\"buzz\" class=\"${state.buzz.includes(s.n)?'on':''}\" ${!state.buzzEnabled||homeLocked?'disabled':''}><span class=\"student-command-icon\">${state.buzz.includes(s.n)?'✓':'⚡'}</span><span class=\"student-command-copy\"><b>${state.buzz.includes(s.n)?'Buzzed In':'Buzz In'}</b><small>${state.buzz.includes(s.n)?'You’re in the queue':'Jump into the discussion'}</small></span></button>")]
          for old,new in pairs:
              assert s.count(old)==1, (old[:50],s.count(old))
              s=s.replace(old,new,1)
          marker='id="v69-student-hand-buzz-feedback"'
          assert marker not in s
          block="<style id=\"v69-student-hand-buzz-feedback\">\nbody.role-student .student-actions.home-controls button[data-class-action=\"hand\"].on{\n  color:#ffe18b!important;\n  border-color:#ffc447!important;\n  background:\n    radial-gradient(circle at 18% 50%,rgba(255,196,71,.58),transparent 30%),\n    radial-gradient(circle at 86% 0%,rgba(255,231,151,.20),transparent 36%),\n    linear-gradient(145deg,#6c4b0e,#473519 58%,#292117)!important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 24px rgba(0,0,0,.38),0 0 30px rgba(255,196,71,.48)!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action=\"hand\"].on .student-command-icon{\n  color:#fff!important;\n  border-color:#ffe6a0!important;\n  background:rgba(104,72,12,.74)!important;\n  box-shadow:0 0 18px #ffd15f,0 0 36px rgba(255,196,71,.55)!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action=\"buzz\"].on{\n  color:#ff9ee0!important;\n  border-color:#ff63c7!important;\n  background:\n    radial-gradient(circle at 18% 50%,rgba(255,99,199,.60),transparent 30%),\n    radial-gradient(circle at 86% 0%,rgba(255,168,223,.20),transparent 36%),\n    linear-gradient(145deg,#7b1d5d,#4d2243 58%,#2b1828)!important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 24px rgba(0,0,0,.38),0 0 32px rgba(255,99,199,.50)!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action=\"buzz\"].on .student-command-icon{\n  color:#fff!important;\n  border-color:#ffb6e7!important;\n  background:rgba(104,24,77,.76)!important;\n  box-shadow:0 0 18px #ff83d4,0 0 36px rgba(255,99,199,.58)!important;\n}\nbody.role-student .student-actions.home-controls button[data-class-action=\"hand\"].on::before,\nbody.role-student .student-actions.home-controls button[data-class-action=\"buzz\"].on::before{\n  content:\"ACTIVE\"!important;\n  position:absolute!important;\n  top:7px!important;\n  right:8px!important;\n  padding:2px 5px!important;\n  border:1px solid currentColor!important;\n  border-radius:999px!important;\n  background:rgba(4,10,18,.54)!important;\n  color:currentColor!important;\n  font-size:6px!important;\n  font-weight:950!important;\n  letter-spacing:.12em!important;\n}\n</style>"
          pos=s.index("</head>")
          s=s[:pos]+block+"\n"+s[pos:]
          assert s.count(marker)==1
          assert s.index(marker)<s.index("</head>")
          p.write_text(s,encoding="utf-8")
          print("bytes",p.stat().st_size)
          PY
          rm -f .github/workflows/one-shot-hand-buzz-feedback.yml
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-hand-buzz-feedback.yml
          git commit -m 'Polish Student Hand and Buzz feedback'
          git push origin HEAD:main
