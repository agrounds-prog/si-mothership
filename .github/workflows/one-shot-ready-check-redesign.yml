name: One-shot Student Ready Check redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ready-check-redesign.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Redesign Student Ready Check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "ded98c80f1b557b3f2459a221054f1bf7c44ea95"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="""if(state.screen==='ready')return `<div class="student-prompt"><span class="eyebrow">READY CHECK</span><h2>Are you ready?</h2><p>Your answer goes to your teacher.</p><div class="response-grid"><button class="response-btn ${s.readyResponse==='Ready'?'selected':''}" data-response="ready" data-value="Ready">✓ Ready</button><button class="response-btn ${s.readyResponse==='Not yet'?'selected':''}" data-response="ready" data-value="Not yet">◷ Not yet</button></div></div>`;"""
          new="""if(state.screen==='ready')return `<div class="student-prompt ready-check-surface"><span class="eyebrow">READY CHECK</span><h2>Are you ready?</h2><p>Your answer goes directly to your teacher.</p><div class="response-grid ready-grid"><button class="response-btn ready-yes ${s.readyResponse==='Ready'?'selected':''}" data-response="ready" data-value="Ready"><span class="ready-choice-icon">✓</span><span>Ready</span></button><button class="response-btn ready-later ${s.readyResponse==='Not yet'?'selected':''}" data-response="ready" data-value="Not yet"><span class="ready-choice-icon">◷</span><span>Not yet</span></button></div>${s.readyResponse?`<div class="ready-confirmation">${s.readyResponse==='Ready'?'✓ Ready response sent':'◷ Not yet response sent'}</div>`:''}</div>`;"""
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          marker='id="v64-student-ready-check"'
          assert marker not in s
          block="<style id=\"v64-student-ready-check\">\nbody.role-student .student-prompt.ready-check-surface{\n  width:min(100%,650px)!important;\n  max-width:650px!important;\n  padding:34px 28px!important;\n  border:2px solid #3bbce9!important;\n  border-radius:28px!important;\n  background:\n    radial-gradient(circle at 50% 0%,rgba(54,193,241,.24),transparent 36%),\n    linear-gradient(180deg,#0a2a41,#061725 72%,#04111d)!important;\n  box-shadow:inset 0 0 0 6px #020b13,inset 0 0 0 7px rgba(104,226,255,.12),0 20px 48px rgba(0,0,0,.42),0 0 32px rgba(51,202,255,.15)!important;\n}\nbody.role-student .ready-check-surface .eyebrow{\n  color:#8feeff!important;\n  font-size:11px!important;\n  letter-spacing:.22em!important;\n}\nbody.role-student .ready-check-surface h2{\n  margin:10px 0 8px!important;\n  font-size:clamp(38px,8vw,58px)!important;\n  line-height:1!important;\n  color:#fff!important;\n  text-shadow:0 0 20px rgba(95,224,255,.16)!important;\n}\nbody.role-student .ready-check-surface>p{\n  margin:0!important;\n  color:#bfd5e1!important;\n  font-size:16px!important;\n}\nbody.role-student .ready-check-surface .response-grid.ready-grid{\n  max-width:560px!important;\n  margin:24px auto 0!important;\n  gap:14px!important;\n}\nbody.role-student .ready-check-surface .response-btn{\n  min-height:118px!important;\n  display:flex!important;\n  align-items:center!important;\n  justify-content:center!important;\n  gap:12px!important;\n  border-width:2px!important;\n  border-radius:22px!important;\n  font-size:21px!important;\n  font-weight:950!important;\n  transition:transform .15s ease,filter .15s ease,box-shadow .15s ease!important;\n}\nbody.role-student .ready-check-surface .ready-yes{\n  color:#ecfff7!important;\n  border-color:#37e4a2!important;\n  background:\n    radial-gradient(circle at 20% 50%,rgba(60,255,187,.42),transparent 34%),\n    linear-gradient(145deg,#0d5a44,#0a332f 62%,#082229)!important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 10px 22px rgba(0,0,0,.34),0 0 26px rgba(55,228,162,.30)!important;\n}\nbody.role-student .ready-check-surface .ready-later{\n  color:#fff6db!important;\n  border-color:#ffbd4a!important;\n  background:\n    radial-gradient(circle at 20% 50%,rgba(255,193,70,.38),transparent 34%),\n    linear-gradient(145deg,#5a390b,#312819 62%,#191a1e)!important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 10px 22px rgba(0,0,0,.34),0 0 26px rgba(255,189,74,.25)!important;\n}\nbody.role-student .ready-check-surface .response-btn span.ready-choice-icon{\n  width:50px!important;\n  height:50px!important;\n  display:grid!important;\n  place-items:center!important;\n  flex:0 0 50px!important;\n  border:2px solid currentColor!important;\n  border-radius:50%!important;\n  font-size:26px!important;\n  background:rgba(2,10,17,.38)!important;\n  box-shadow:0 0 20px currentColor!important;\n}\nbody.role-student .ready-check-surface .response-btn.selected{\n  transform:translateY(-2px)!important;\n  filter:saturate(1.25) brightness(1.08)!important;\n  outline:3px solid rgba(255,255,255,.82)!important;\n  outline-offset:2px!important;\n}\nbody.role-student .ready-check-surface .ready-confirmation{\n  margin-top:18px!important;\n  padding:10px 14px!important;\n  border:1px solid rgba(111,230,255,.34)!important;\n  border-radius:999px!important;\n  background:#071b2a!important;\n  color:#ccefff!important;\n  font-size:11px!important;\n  font-weight:850!important;\n  letter-spacing:.04em!important;\n}\n@media(max-width:520px){\n  body.role-student .device-main:has(.ready-check-surface){padding:10px 8px 12px!important;min-height:0!important;align-items:flex-start!important}\n  body.role-student .student-prompt.ready-check-surface{padding:22px 14px 18px!important;border-radius:22px!important}\n  body.role-student .ready-check-surface h2{font-size:38px!important;margin:7px 0 6px!important}\n  body.role-student .ready-check-surface>p{font-size:14px!important}\n  body.role-student .ready-check-surface .response-grid.ready-grid{grid-template-columns:1fr 1fr!important;gap:9px!important;margin-top:18px!important}\n  body.role-student .ready-check-surface .response-btn{min-height:88px!important;gap:7px!important;font-size:15px!important;border-radius:17px!important;padding:9px!important}\n  body.role-student .ready-check-surface .response-btn span.ready-choice-icon{width:38px!important;height:38px!important;flex-basis:38px!important;font-size:20px!important}\n  body.role-student .ready-check-surface .ready-confirmation{margin-top:12px!important;font-size:9px!important}\n}\n</style>"
          pos=s.index("</head>")
          s=s[:pos]+block+"\n"+s[pos:]
          assert s.count(marker)==1
          p.write_text(s,encoding="utf-8")
          print("bytes",p.stat().st_size)
          PY
          rm -f .github/workflows/one-shot-ready-check-redesign.yml
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-ready-check-redesign.yml
          git commit -m 'Redesign Student Ready Check'
          git push origin HEAD:main
