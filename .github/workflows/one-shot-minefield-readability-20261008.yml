name: Guarded Minefield cooperative outcome display
on:
  push:
    paths:
      - '.github/workflows/one-shot-minefield-readability-20261008.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record pre-existing release failures
        run: python scripts/release_gate.py --require-node > /tmp/before.log || true
      - name: Apply guarded narrow patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html')
          raw=p.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          print('Source guard:',len(raw),blob)
          assert blob=='0cd8426a612118238432b5dae3d280b3d2b97d9a'
          assert len(raw)>1350000
          s=raw.decode('utf-8')
          D=chr(36)
          def replace(old,new,n=1):
           global s
           actual=s.count(old)
           assert actual==n,(old[:100],actual,n)
           s=s.replace(old,new)
          anchor='  const log=(run.narrationLog||[]).slice(-4,-1).reverse();'
          addition="""
            const simple=!!(run.mf?.simple||run.mfClass?.simple||(run.mfTeams||[]).some(m=>m?.simple));
            const kind=(run.narrationLog||[]).slice(-1)[0]?.kind||'turn';
            const label=kind==='mine'?'💣 MINE! −1':kind==='special'?'♥ HEALTH FOUND':kind==='win'?'🏆 MAP CLEARED!':kind==='select'?'⌖ SQUARE SELECTED':kind==='turn'?'CREW READY':'✓ SAFE!';
            const signalMarkup=simple?'<div class="mf-coop-signal signal-'+kind+'">'+esc(label)+'</div>':'';
          """.rstrip()
          replace(anchor,anchor+addition)
          needle='<div class="minefield-narrator-latest">'+D+'{esc(latest)}</div>'
          replace(needle,D+'{signalMarkup}'+needle)
          helper="""function minefieldTeacherProgressMarkup(mf){
            if(!mf?.simple)return '';
            const p=minefieldClearProgress(mf);
            return '<div class="mf-teacher-progress"><span>SAFE SQUARES CLEARED</span><strong>'+p.cleared+' / '+p.total+'</strong></div>';
          }
          """
          replace('function minefieldSymbol(tile,current,showHidden=false){',helper+'function minefieldSymbol(tile,current,showHidden=false){')
          old=D+'{minefieldNarrationMarkup(run,false,true)}<p>'+D+'{esc(mf.message)}</p>'
          replace(old,D+'{minefieldNarrationMarkup(run,false,true)}'+D+'{minefieldTeacherProgressMarkup(mf)}<p>'+D+'{esc(mf.message)}</p>',2)
          sty="""<style id="v95-minefield-readability">
          #shared .minefield-narrator .mf-coop-signal,.minefield-status-card .mf-coop-signal,body.role-student .mf-coop-signal{
           display:block;width:fit-content;max-width:100%;margin:8px auto 10px;padding:11px 18px;
           border:2px solid #60d8b0;border-radius:13px;background:#104b4b;color:#e0fff2;
           font-weight:1000;font-size:clamp(23px,2.6vw,43px);line-height:1.1;letter-spacing:.035em;
           text-align:center;text-shadow:0 2px 6px #001822;
          }
          .minefield-narrator .mf-coop-signal.signal-mine{border-color:#ff8795;background:#743047;color:white}
          .minefield-narrator .mf-coop-signal.signal-special{border-color:#ff9cc7;background:#6c3159;color:white}
          .minefield-narrator .mf-coop-signal.signal-win{border-color:#bcff96;background:#376b45;color:#f3fff0}
          .minefield-narrator .mf-coop-signal.signal-select,.minefield-narrator .mf-coop-signal.signal-turn{border-color:#8fc9ff;background:#1b4065;color:white}
          #shared .minefield-narrator .minefield-narrator-latest{font-size:clamp(14px,1.25vw,19px);line-height:1.35}
          #shared .minefield-narrator .minefield-event-log>div{font-size:clamp(11px,1vw,14px);line-height:1.3;padding:6px}
          #shared .minefield-simple-legend>span{font-size:clamp(13px,1.05vw,18px)!important}
          #teacher .mf-teacher-progress{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0;padding:10px 12px;background:#102f49;border:1px solid #5287a1;border-radius:10px}
          #teacher .mf-teacher-progress span{font-size:11px;font-weight:900;color:#c9edfb;letter-spacing:.075em}
          #teacher .mf-teacher-progress strong{color:#b7ffe3;font-size:20px;white-space:nowrap}
          @media(max-width:700px){.minefield-narrator .mf-coop-signal{font-size:22px;padding:8px 10px}}
          </style>"""
          assert s.count('v95-minefield-readability')==0
          idx=s.index('</head>')
          assert 750000<idx<850000
          s=s[:idx]+sty+s[idx:]
          out=s.encode('utf-8')
          assert len(raw)<len(out)<len(raw)+6500
          p.write_bytes(out)
          newblob=hashlib.sha1(b'blob '+str(len(out)).encode()+b'\0'+out).hexdigest()
          print('Postpatch guard:',len(out),newblob,'delta',len(out)-len(raw))
          assert out.count(b'function resolveMinefieldMove(')==1
          assert out.count(b'function resolveMinefieldMoveLegacy(')==1
          print('PASS Minefield guarded patch')
          PY
      - name: Verify no new failures
        run: |
          python scripts/release_gate.py --require-node > /tmp/after.log || true
          python - <<'PY'
          from pathlib import Path
          lines=lambda p:Path(p).read_text().splitlines()
          before=lines('/tmp/before.log')
          after=lines('/tmp/after.log')
          failures=lambda xs:sorted(x for x in xs if x.startswith('FAIL'))
          print('Before:',failures(before))
          print('After:',failures(after))
          assert failures(before)==failures(after)
          assert len(failures(after))<=1
          assert any('PASS  javascript: inline scripts parse' in x for x in after)
          print('PASS release gate: no new failures, inline JS parses')
          PY
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit and push verified source
        run: |
          git config user.name "SI Mothership Guarded CI"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Polish cooperative Minefield outcome cues and teacher progress"
          git push origin HEAD:main
