name: One-shot Teacher response rail polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-teacher-response-rail.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Polish Teacher response rail
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "965898fd22bb548e35a37e5e9ba64d809d1dde38"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker='id="v71-teacher-response-rail"'
          assert marker not in s
          block="<style id=\"v71-teacher-response-rail\">\n#teacher .right-rail{\n  gap:12px!important;\n}\n#teacher .attention-summary{\n  padding:12px!important;\n  border:1px solid #2a4b67!important;\n  border-radius:16px!important;\n  background:\n    radial-gradient(circle at 12% 0%,rgba(69,205,255,.12),transparent 34%),\n    linear-gradient(180deg,#0b1d2e,#081522)!important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 24px rgba(0,0,0,.22)!important;\n}\n#teacher .attention-summary-copy b{\n  display:block!important;\n  margin-top:5px!important;\n  color:#eef8ff!important;\n  font-size:13px!important;\n}\n#teacher .attention-summary-chips{\n  gap:6px!important;\n}\n#teacher .attention-chip{\n  min-width:52px!important;\n  padding:6px 8px!important;\n  border-width:1px!important;\n  border-radius:999px!important;\n  font-weight:950!important;\n  opacity:.72!important;\n}\n#teacher .attention-chip.active{\n  opacity:1!important;\n  transform:translateY(-1px)!important;\n}\n#teacher .attention-chip.help.active{color:#d49aff!important;border-color:#a864d5!important;background:#2b173c!important;box-shadow:0 0 16px rgba(176,108,255,.28)!important}\n#teacher .attention-chip.buzz.active{color:#ff86d5!important;border-color:#c94a99!important;background:#351328!important;box-shadow:0 0 16px rgba(255,99,199,.28)!important}\n#teacher .attention-chip.photo.active{color:#78e9ff!important;border-color:#42bddd!important;background:#0a2b3b!important;box-shadow:0 0 16px rgba(67,207,255,.28)!important}\n\n#teacher .right-rail .attention-panel{\n  position:relative!important;\n  overflow:hidden!important;\n  padding:12px!important;\n  border-radius:16px!important;\n  background:linear-gradient(180deg,#0a1929,#071421)!important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 24px rgba(0,0,0,.18)!important;\n}\n#teacher .right-rail .attention-panel::before{\n  content:\"\"!important;\n  position:absolute!important;\n  left:0!important;\n  top:0!important;\n  bottom:0!important;\n  width:3px!important;\n  opacity:.28!important;\n}\n#teacher #buzzPanel{border:1px solid #64385c!important}\n#teacher #buzzPanel::before{background:#ff63c7!important}\n#teacher #helpInboxPanel{border:1px solid #4e3c68!important}\n#teacher #helpInboxPanel::before{background:#b06cff!important}\n#teacher #photoInboxPanel{border:1px solid #28536b!important}\n#teacher #photoInboxPanel::before{background:#43cfff!important}\n#teacher .attention-panel.has-attention{\n  filter:saturate(1.06)!important;\n}\n#teacher #buzzPanel.has-attention{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 22px rgba(255,99,199,.16)!important}\n#teacher #helpInboxPanel.has-attention{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 22px rgba(176,108,255,.16)!important}\n#teacher #photoInboxPanel.has-attention{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 22px rgba(67,207,255,.16)!important}\n\n#teacher .attention-panel .section-heading{\n  margin-bottom:10px!important;\n  padding-bottom:8px!important;\n  border-bottom:1px solid rgba(120,160,190,.12)!important;\n}\n#teacher .attention-panel .section-heading>b{\n  min-width:28px!important;\n  height:28px!important;\n  display:grid!important;\n  place-items:center!important;\n  border-radius:999px!important;\n  background:#101f2d!important;\n  color:#eaf7ff!important;\n  font-size:12px!important;\n  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)!important;\n}\n#teacher #buzzPanel.has-attention .section-heading>b{color:#ff8bd8!important;background:#301427!important}\n#teacher #helpInboxPanel.has-attention .section-heading>b{color:#d8a3ff!important;background:#28183a!important}\n#teacher #photoInboxPanel.has-attention .section-heading>b{color:#8cefff!important;background:#0a2b3a!important}\n\n#teacher #buzzRows,\n#teacher #helpRows,\n#teacher #photoRows{\n  display:grid!important;\n  gap:7px!important;\n}\n#teacher .inbox-student-row{\n  min-height:58px!important;\n  padding:8px!important;\n  border:1px solid #283d51!important;\n  border-radius:12px!important;\n  background:#0a1725!important;\n}\n#teacher .inbox-student-row:first-child{\n  border-color:#a04480!important;\n  background:linear-gradient(145deg,#2d1226,#0b1825)!important;\n  box-shadow:0 0 16px rgba(255,99,199,.12)!important;\n}\n#teacher .queue-num{\n  width:24px!important;\n  height:24px!important;\n  display:grid!important;\n  place-items:center!important;\n  border-radius:999px!important;\n  background:#172637!important;\n  color:#9fb6c8!important;\n  font-size:10px!important;\n  font-weight:950!important;\n}\n#teacher .inbox-student-row:first-child .queue-num{\n  background:#5b1d48!important;\n  color:#ffb7e6!important;\n}\n#teacher .inbox-copy b{\n  color:#f4f9ff!important;\n  font-size:12px!important;\n}\n#teacher .inbox-copy small{\n  color:#8198ad!important;\n  font-size:9px!important;\n  letter-spacing:.02em!important;\n}\n#teacher .inbox-student-row:first-child .inbox-copy small{\n  color:#ff9fdd!important;\n  font-weight:900!important;\n}\n#teacher .xbtn,\n#teacher .photo-delete,\n#teacher [data-help-delete]{\n  border-radius:9px!important;\n  background:#25131a!important;\n  color:#ff8eaa!important;\n  border:1px solid #5e2b3b!important;\n}\n\n#teacher .help-message-row{\n  min-height:62px!important;\n  padding:8px!important;\n  border:1px solid #2b3d51!important;\n  border-radius:12px!important;\n  background:#0a1725!important;\n}\n#teacher .help-message-row.unread{\n  border-color:#754da0!important;\n  background:linear-gradient(145deg,#251536,#0a1725)!important;\n  box-shadow:0 0 18px rgba(176,108,255,.14)!important;\n}\n#teacher .help-message-row.unread .preview b::after{\n  content:\" NEW\"!important;\n  display:inline-block!important;\n  margin-left:6px!important;\n  padding:2px 5px!important;\n  border:1px solid #9d68c6!important;\n  border-radius:999px!important;\n  color:#d9aaff!important;\n  font-size:6px!important;\n  font-weight:950!important;\n  letter-spacing:.10em!important;\n  vertical-align:middle!important;\n}\n#teacher .help-message-row .preview b{color:#f4f9ff!important;font-size:12px!important}\n#teacher .help-message-row .preview small{color:#9baec0!important;font-size:9px!important}\n#teacher [data-help-open]{\n  border:1px solid #6f4b91!important;\n  background:#251736!important;\n  color:#d8abff!important;\n  font-weight:900!important;\n}\n\n#teacher .photo-row{\n  min-height:66px!important;\n  display:grid!important;\n  grid-template-columns:54px minmax(0,1fr) auto auto!important;\n  gap:8px!important;\n  align-items:center!important;\n  padding:7px!important;\n  border:1px solid #29475c!important;\n  border-radius:12px!important;\n  background:#091725!important;\n}\n#teacher .photo-thumb{\n  width:54px!important;\n  height:48px!important;\n  object-fit:cover!important;\n  border:1px solid #3aaed1!important;\n  border-radius:9px!important;\n  cursor:pointer!important;\n}\n#teacher .photo-row span b{display:block!important;color:#f4f9ff!important;font-size:12px!important}\n#teacher .photo-row span small{display:block!important;margin-top:3px!important;color:#85a3b8!important;font-size:8px!important;font-weight:850!important}\n#teacher .photo-row span small:not(:empty){letter-spacing:.04em!important}\n#teacher .photo-row:has(span small:nth-child(2)){\n  transition:border-color .15s ease,box-shadow .15s ease!important;\n}\n#teacher .photo-row .checkbtn{\n  width:30px!important;\n  height:30px!important;\n  display:grid!important;\n  place-items:center!important;\n  border-radius:9px!important;\n}\n#teacher [data-photo-view]{\n  border:1px solid #2e718a!important;\n  background:#0b2635!important;\n  color:#7be9ff!important;\n}\n#teacher .photo-inbox-actions{\n  display:grid!important;\n  grid-template-columns:1fr auto!important;\n  gap:7px!important;\n  margin-top:10px!important;\n}\n#teacher .photo-inbox-actions .clear{\n  min-height:34px!important;\n  border-radius:9px!important;\n}\n#teacher #clearBuzz{\n  min-height:34px!important;\n  border-radius:9px!important;\n  margin-top:10px!important;\n}\n#teacher .attention-panel .empty{\n  margin:4px 0!important;\n  padding:12px 8px!important;\n  border:1px dashed #284053!important;\n  border-radius:10px!important;\n  color:#6f879b!important;\n  background:#08131e!important;\n  text-align:center!important;\n  font-size:10px!important;\n}\n#teacher .attention-panel.is-empty{\n  opacity:.82!important;\n}\n@media(max-width:1150px){\n  #teacher .right-rail{\n    gap:10px!important;\n  }\n}\n</style>"
          pos=s.index("</head>")
          s=s[:pos]+block+"\n"+s[pos:]
          assert s.count(marker)==1
          assert s.index(marker)<s.index("</head>")
          p.write_text(s,encoding="utf-8")
          print("bytes",p.stat().st_size)
          PY
          rm -f .github/workflows/one-shot-teacher-response-rail.yml
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-teacher-response-rail.yml
          git commit -m 'Polish Teacher response rail'
          git push origin HEAD:main
