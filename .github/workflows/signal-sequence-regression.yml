name: Signal Sequence Regression
on:
  push:
    branches: [main]
    paths:
      - 'signal-sequence.js'
      - 'signal-sequence.css'
      - 'signal-sequence-bridge.js'
      - 'signal_sequence_server.py'
      - 'tests/test_signal_sequence_engine.cjs'
      - 'tests/test_signal_sequence_server.py'
      - 'tests/test_signal_sequence_browser.cjs'
      - 'tests/test_signal_sequence_mobile_browser.cjs'
      - 'tests/test_signal_sequence_websocket.py'
      - 'server.py'
      - 'index.html'
      - '.github/workflows/signal-sequence-regression.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  signal-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Engine, private-state and server validation
        run: |
          node --check signal-sequence.js
          node --check signal-sequence-bridge.js
          node tests/test_signal_sequence_engine.cjs
          python -m unittest discover -s tests -p 'test_signal_sequence_server.py' -v
          python -m py_compile server.py signal_sequence_server.py
      - name: Existing release gate
        run: python scripts/release_gate.py --require-node
      - name: Install local browser dependencies
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_signal_sequence_websocket.py' -v
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch isolated Mothership
        run: |
          mkdir -p /tmp/signal-sequence-data
          MOTHERSHIP_NO_BROWSER=1 MOTHERSHIP_DATA_DIR=/tmp/signal-sequence-data PORT=8877 python server.py >/tmp/signal-sequence.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8877/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/signal-sequence.log
          exit 1
      - name: Live Activity Library and Classic browser gameplay
        run: node tests/test_signal_sequence_browser.cjs
      - name: Real student mobile touch and multiplayer round progression
        run: node tests/test_signal_sequence_mobile_browser.cjs
      - name: Local diagnostics on failure
        if: failure()
        run: tail -90 /tmp/signal-sequence.log || true
