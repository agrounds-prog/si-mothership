name: Inspect MILLION current code
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-million-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing gameplay and storage (no modifications)
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          lines=s.splitlines()
          print('INDEX_BYTES',len(s),'INDEX_LINES',len(lines))
          slices=[(15598,15683),(17448,17536),(18052,18060),(18370,18391),(16450,16485),(17359,17381)]
          for a,b in slices:
            print('=== FULL BLOCK',a,b)
            for i in range(a-1,b):print(f'{i+1:>5} {lines[i]}')
          for path in ['server.py','index.html']:
            ss=Path(path).read_text().splitlines()
            tags=['teacher_preset','teacher-library','preset/save','preset/list','saved_presentation','presentation_library','/api/teacher','teacher-storage']
            locations=[(i,l) for i,l in enumerate(ss) if any(k.lower() in l.lower() for k in tags)]
            print('=== STORAGE INDEX',path,[(i+1,l[:180]) for i,l in locations[:100]])
            for i,l in locations[:12]:
              print('\n'.join(f'{j+1:>5} {ss[j][:300]}' for j in range(max(0,i-2),min(len(ss),i+8))))
          PY