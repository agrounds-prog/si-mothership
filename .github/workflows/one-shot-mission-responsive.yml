name: One-shot Mission Control responsive spacing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-mission-responsive.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Guarded responsive CSS patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html')
          raw=p.read_bytes()
          digest=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert digest=='fb3e7e87e2e29cde778ab227cf5bee6c5b3f6a27',f'Stale source blob: {digest}'
          assert 1300000<len(raw)<1400000,f'Source size unexpected: {len(raw)}'
          s=raw.decode('utf-8')
          marker='id="v58-mission-responsive-readability"'
          assert marker not in s
          assert 'id="v57-mission-control-readability"' in s
          css='''<style id="v58-mission-responsive-readability">
          /* Responsive teacher command layout only; no controls, IDs or handlers altered. */
          #teacher .teacher-control-groups{min-width:0!important}
          #teacher .teacher-control-group{min-width:0!important}
          #teacher .teacher-control-group .control-group-buttons{min-width:0!important}
          #teacher .teacher-controlbar .control{min-width:0!important}
          #teacher .mission-context-kicker{font-size:9px!important;line-height:1.25!important}
          #teacher .teacher-live-strip .students-see,#teacher .teacher-live-strip .students-see b{font-size:10px!important;line-height:1.35!important}
          #teacher .mission-state-pill{font-size:10px!important;min-height:25px!important}
          #teacher .session-group .mission-workflow-btn{min-height:56px!important;font-size:11px!important;line-height:1.25!important}
          @media(min-width:1181px) and (max-width:1600px){
            #teacher .teacher-control-groups{grid-template-columns:minmax(245px,.72fr) minmax(0,1.45fr)!important}
          }
          @media(min-width:761px) and (max-width:1180px){
            #teacher .nav-group .control-group-buttons{grid-template-columns:repeat(4,minmax(0,1fr))!important}
            #teacher .response-group .control-group-buttons{grid-template-columns:repeat(4,minmax(0,1fr))!important}
          }
          @media(max-width:760px){
            #teacher .teacher-live-strip{flex-wrap:wrap!important}
            #teacher .teacher-live-hint{max-width:100%!important}
            #teacher .mission-context-title>b{max-width:min(66vw,360px)!important}
            #teacher .control-group-label{font-size:10px!important}
          }
          </style>
          '''
          s=s[:s.index('</head>')]+css+s[s.index('</head>'):]
          assert s.count(marker)==1 and s.index(marker)<s.index('</head>')
          p.write_text(s,encoding='utf-8')
          new=p.read_bytes()
          print('SOURCE_OK',digest,'NEW_BLOB',hashlib.sha1(b'blob '+str(len(new)).encode()+b'\0'+new).hexdigest(),'NEW_BYTES',len(new))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve Mission Control responsive spacing and labels"
          git push
