name: One-shot Student Understanding Check redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-understanding-check-redesign.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Redesign Student Understanding Check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "dec9a5fb153aef3accd91127b1513fc1b0b97950"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="if(state.screen==='understanding'){\n    const opts=['Got it','Mostly','Unsure','Need help'];return `<div class=\"student-prompt\"><span class=\"eyebrow\">UNDERSTANDING</span><h2>How well do you understand?</h2><div class=\"response-grid\">${opts.map(v=>`<button class=\"response-btn ${s.understanding===v?'selected':''}\" data-response=\"understanding\" data-value=\"${v}\">${v}</button>`).join('')}</div></div>`;\n  }"
          new="if(state.screen==='understanding'){\n    const opts=[['✓','Got it'],['≈','Mostly'],['?','Unsure'],['!','Need help']];\n    return `<div class=\"student-prompt understanding-check-surface\"><span class=\"eyebrow\">UNDERSTANDING CHECK</span><h2>How well do you understand?</h2><p>Choose the answer that fits you best.</p><div class=\"response-grid understanding-grid\">${opts.map(([i,v])=>`<button class=\"response-btn understanding-choice ${s.understanding===v?'selected':''}\" data-response=\"understanding\" data-value=\"${v}\"><span class=\"understanding-icon\">${i}</span><span>${v}</span></button>`).join('')}</div>${s.understanding?`<div class=\"understanding-confirmation\">${s.understanding} response sent to your teacher</div>`:''}</div>`;\n  }"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          marker='id="v66-student-understanding-check"'
          assert marker not in s
          block="<style id=\"v66-student-understanding-check\">\nbody.role-student .student-prompt.understanding-check-surface{width:min(100%,680px)!important;max-width:680px!important;padding:30px 24px 28px!important;border:2px solid #3bbce9!important;border-radius:28px!important;background:radial-gradient(circle at 50% 0%,rgba(54,193,241,.22),transparent 36%),linear-gradient(180deg,#0a2a41,#061725 72%,#04111d)!important;box-shadow:inset 0 0 0 6px #020b13,inset 0 0 0 7px rgba(104,226,255,.12),0 20px 48px rgba(0,0,0,.42),0 0 32px rgba(51,202,255,.14)!important}\nbody.role-student .understanding-check-surface .eyebrow{color:#8feeff!important;font-size:11px!important;letter-spacing:.22em!important}\nbody.role-student .understanding-check-surface h2{margin:10px 0 6px!important;font-size:clamp(34px,7vw,52px)!important;line-height:1!important;color:#fff!important}\nbody.role-student .understanding-check-surface>p{margin:0!important;color:#bfd5e1!important;font-size:15px!important}\nbody.role-student .understanding-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;max-width:590px!important;margin:22px auto 0!important}\nbody.role-student .understanding-choice{min-height:112px!important;display:grid!important;grid-template-columns:50px 1fr!important;align-items:center!important;gap:12px!important;padding:14px 16px!important;border:2px solid!important;border-radius:22px!important;font-size:20px!important;font-weight:950!important;color:#fff!important;text-align:left!important}\nbody.role-student .understanding-icon{width:48px!important;height:48px!important;display:grid!important;place-items:center!important;border:2px solid currentColor!important;border-radius:50%!important;background:rgba(2,10,17,.4)!important;font-size:24px!important;box-shadow:0 0 18px currentColor!important}\nbody.role-student .understanding-choice[data-value=\"Got it\"]{color:#64ffd0!important;border-color:#38e3a4!important;background:radial-gradient(circle at 14% 50%,rgba(56,227,164,.34),transparent 28%),linear-gradient(145deg,#0c5b45,#092b2c)!important;box-shadow:0 0 24px rgba(56,227,164,.24)!important}\nbody.role-student .understanding-choice[data-value=\"Mostly\"]{color:#6fe5ff!important;border-color:#48cfff!important;background:radial-gradient(circle at 14% 50%,rgba(72,207,255,.34),transparent 28%),linear-gradient(145deg,#0b506b,#09283b)!important;box-shadow:0 0 24px rgba(72,207,255,.22)!important}\nbody.role-student .understanding-choice[data-value=\"Unsure\"]{color:#ffd45f!important;border-color:#ffc24d!important;background:radial-gradient(circle at 14% 50%,rgba(255,194,77,.34),transparent 28%),linear-gradient(145deg,#60450d,#31291a)!important;box-shadow:0 0 24px rgba(255,194,77,.22)!important}\nbody.role-student .understanding-choice[data-value=\"Need help\"]{color:#ff82c8!important;border-color:#ff58b4!important;background:radial-gradient(circle at 14% 50%,rgba(255,88,180,.34),transparent 28%),linear-gradient(145deg,#5d183f,#321a2c)!important;box-shadow:0 0 24px rgba(255,88,180,.24)!important}\nbody.role-student .understanding-choice.selected{transform:translateY(-2px) scale(1.02)!important;filter:saturate(1.25) brightness(1.10)!important;outline:3px solid rgba(255,255,255,.88)!important;outline-offset:2px!important}\nbody.role-student .understanding-confirmation{margin-top:16px!important;padding:10px 14px!important;border:1px solid rgba(111,230,255,.34)!important;border-radius:999px!important;background:#071b2a!important;color:#ccefff!important;font-size:11px!important;font-weight:850!important}\n@media(max-width:520px){body.role-student .device-main:has(.understanding-check-surface){padding:8px 7px 10px!important;min-height:0!important;align-items:flex-start!important}body.role-student .student-prompt.understanding-check-surface{padding:18px 11px 16px!important;border-radius:22px!important}body.role-student .understanding-check-surface h2{font-size:32px!important;margin:7px 0 5px!important}body.role-student .understanding-check-surface>p{font-size:13px!important}body.role-student .understanding-grid{gap:8px!important;margin-top:16px!important}body.role-student .understanding-choice{min-height:82px!important;grid-template-columns:38px 1fr!important;gap:8px!important;padding:9px 10px!important;border-radius:16px!important;font-size:14px!important}body.role-student .understanding-icon{width:36px!important;height:36px!important;font-size:18px!important}body.role-student .understanding-confirmation{margin-top:11px!important;font-size:9px!important}}\n</style>"
          pos=s.index("</head>")
          s=s[:pos]+block+"\n"+s[pos:]
          assert s.count(marker)==1
          assert s.index(marker)<s.index("</head>")
          p.write_text(s,encoding="utf-8")
          print("bytes",p.stat().st_size)
          PY
          rm -f .github/workflows/one-shot-understanding-check-redesign.yml
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-understanding-check-redesign.yml
          git commit -m 'Redesign Student Understanding Check'
          git push origin HEAD:main
