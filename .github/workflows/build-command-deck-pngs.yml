name: Build illustrated command deck PNG assets
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_command_deck_pngs.py'
      - '.github/workflows/build-command-deck-pngs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - name: Render high-resolution image assets from existing committed artwork
        run: python scripts/build_command_deck_pngs.py
      - name: Commit rendered PNGs
        run: |
          git config user.name "SI Mothership Artwork Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/command-deck-v3
          if ! git diff --staged --quiet; then
            git commit -m "Generate raster command deck UI artwork"
            git push origin HEAD:main
          fi
