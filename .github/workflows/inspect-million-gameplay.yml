name: MILLION Gameplay Inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-million-gameplay.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Print current game code and public layout anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text().splitlines()
          needles=["function millionResolve","function millionNextQuestion","function millionPublicMarkup","function millionStudentMarkup","function launchMillion","function millionRotatePilot","function millionSetPilot","function renderShared","function sendGameShowAction","function connectedStudents","function publishSyncedState","function selectedStudent","function startActivity","function millionState","million-rung.active","function renderActivityController","function renderActivities"]
          for term in needles:
            idx=next((i for i,l in enumerate(s) if term in l),-1)
            print('###',term,idx+1)
            if idx>=0:
              for j in range(max(0,idx-2),min(len(s),idx+29)): print(str(j+1)+': '+s[j][:1600])
          for a,b in [(5828,6098),(6096,6255)]:
            print('### CSS',a,b)
            for j in range(a-1,b):print(str(j+1)+': '+s[j][:750])
          PY
