name: Repair Bingo guarded workflow
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-repair-bingo-workflow.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Correct Python execution and interpolation markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/one-shot-bingo-blank-card.yml')
          s=p.read_text()
          assert "          set -euo pipefail\n          from pathlib import Path" in s
          s=s.replace("          set -euo pipefail\n          from pathlib import Path","          set -euo pipefail\n          python - <<'PY'\n          from pathlib import Path",1)
          s=s.replace("          git diff --check","          PY\n          git diff --check",1)
          s=s.replace(chr(92)+'${','${')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-shot-bingo-blank-card.yml
          git commit -m "Repair Bingo blank card rollout workflow"
          git push
