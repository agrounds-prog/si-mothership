name: Student Browser Companion Regression
on:
  push:
    branches: [main]
    paths:
      - 'student-companion.css'
      - 'student-companion.js'
      - 'teacher-unified-controls.js'
      - 'teacher-unified-controls.css'
      - 'tests/test_unified_teacher_controls_browser.cjs'
      - 'tests/test_teacher_game_setup_browser.cjs'
      - 'tests/test_teacher_multiplayer_setup_workflows_browser.cjs'
      - 'tests/test_teacher_remaining_setup_workflows_browser.cjs'
      - 'tests/test_match_setup_workflow_browser.cjs'
      - 'tests/test_match_gameplay_visuals_browser.cjs'
      - 'tests/test_million_projector_browser.cjs'
      - 'tests/test_zoom_student_activities_browser.cjs'
      - 'match-arcade.css'
      - 'million-studio.css'
      - 'tests/test_million_studio_browser.cjs'
      - 'bingo-board-studio.js'
      - 'bingo-board-studio.css'
      - 'tests/test_bingo_student_call_alerts.py'
      - 'tests/test_bingo_image_upload_browser.cjs'
      - 'tests/test_student_companion_browser.cjs'
      - 'tests/test_student_popup_window_chromium.cjs'
      - 'tests/test_scientific_calculator_popup_browser.cjs'
      - 'tests/test_zoom_student_activities_browser.cjs'
      - 'tests/test_dominoes_multiplayer_browser.cjs'
      - 'tests/test_zoom_student_remaining_browser.cjs'
      - 'tests/test_zoom_student_bingo_starwheel_survey_browser.cjs'
      - 'tests/test_signal_sequence_mobile_browser.cjs'
      - 'tests/test_signal_sequence_modes_browser.cjs'
      - 'tests/test_four_in_line_mobile_browser.cjs'
      - 'server.py'
      - 'index.html'
      - 'student-device-setup.cmd'
      - 'tests/test_student_device_setup.py'
      - '.github/workflows/student-browser-companion.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  student-companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check student companion JS, server, and release gate
        run: |
          node --check student-companion.js
          node --check teacher-unified-controls.js
          python -m py_compile server.py
          python scripts/release_gate.py --require-node
      - name: Install browser and app dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Bingo student call alerts teacher-only server rules
        run: python -m unittest discover -s tests -p 'test_bingo_student_call_alerts.py' -v
      - name: Windows student shortcut download regression
        run: python -m unittest discover -s tests -p 'test_student_device_setup.py'
      - name: Run isolated classroom
        run: |
          mkdir -p /tmp/mothership-companion-test
          MOTHERSHIP_NO_BROWSER=1 MOTHERSHIP_DATA_DIR=/tmp/mothership-companion-test PORT=8877 python server.py >/tmp/student-companion.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8877/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -60 /tmp/student-companion.log
          exit 1
      - name: Phase 3A MATCH projector, teacher command deck and responsive cards
        run: |
          mkdir -p /tmp/mothership-phase3-match-test
          MOTHERSHIP_NO_BROWSER=1 MOTHERSHIP_DATA_DIR=/tmp/mothership-phase3-match-test PORT=8885 python server.py >/tmp/phase3-match-test.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8885/api/health >/dev/null; then break; fi
            sleep 1
          done
          LOCAL_URL=http://127.0.0.1:8885 node tests/test_match_gameplay_visuals_browser.cjs
      - name: Phase 2F Word Grid, Minefield, Crew Survey, Calculator setup and restoration
        run: |
          mkdir -p /tmp/mothership-remaining-setup-test
          MOTHERSHIP_NO_BROWSER=1 MOTHERSHIP_DATA_DIR=/tmp/mothership-remaining-setup-test PORT=8883 python server.py >/tmp/remaining-setup-test.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8883/api/health >/dev/null; then break; fi
            sleep 1
          done
          LOCAL_URL=http://127.0.0.1:8883 node tests/test_teacher_remaining_setup_workflows_browser.cjs
      - name: Bingo image picker, batch upload and remote persistence regression
        run: node tests/test_bingo_image_upload_browser.cjs
      - name: Student device desktop, Zoom window, join, controls and popup
        run: node tests/test_student_companion_browser.cjs
      - name: Verify real Chrome outer window size (headed Xvfb) and snapped desktop
        run: xvfb-run -a -s '-screen 0 1600x1100x24' node tests/test_student_popup_window_chromium.cjs
      - name: 'Scientific Calculator popup — seven-row keypad, hidden toolbar and no overlap'
        run: node tests/test_scientific_calculator_popup_browser.cjs
      - name: Signal Sequence 4-color + 6-color survival + 8-color relay on student devices
        run: |
          node tests/test_signal_sequence_mobile_browser.cjs
          node tests/test_signal_sequence_modes_browser.cjs
      - name: Four In Line one-tap student controller
        run: LOCAL_URL=http://127.0.0.1:8877 node tests/test_four_in_line_mobile_browser.cjs
      - name: Zoom Quick Poll, Million, Cosmic Cards and Dominoes browser layout
        run: node tests/test_zoom_student_activities_browser.cjs
      - name: Existing Dominoes and Quick Poll browser regressions
        run: |
          node tests/test_dominoes_browser.cjs
          node tests/test_quick_poll_projector_browser.cjs
      - name: Dominoes real student, teacher, and shared-screen sync
        run: node tests/test_dominoes_multiplayer_browser.cjs
      - name: Million teacher and projector regression
        run: node tests/test_million_projector_browser.cjs
      - name: Cosmic Cards turn rules and privacy
        run: python -m unittest discover -s tests -p 'test_cosmic_cards_turn_rules.py'
      - name: Zoom Match, Word Grid and Minefield student controller layout
        run: node tests/test_zoom_student_remaining_browser.cjs
      - name: Existing Word Grid multiplayer browser regression
        run: node tests/test_word_grid_browser.cjs
      - name: Zoom Bingo, Starwheel and Crew Survey student layout
        run: node tests/test_zoom_student_bingo_starwheel_survey_browser.cjs
      - name: Eleven teacher game setup studios, controls and narrow-width regression
        run: node tests/test_teacher_game_setup_browser.cjs
      - name: Phase 2F multiplayer creation, launch, and saved game restoration
        run: |
          mkdir -p /tmp/mothership-multiplayer-setup-test
          MOTHERSHIP_NO_BROWSER=1 MOTHERSHIP_DATA_DIR=/tmp/mothership-multiplayer-setup-test PORT=8880 python server.py >/tmp/multiplayer-setup-test.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8880/api/health >/dev/null; then break; fi
            sleep 1
          done
          LOCAL_URL=http://127.0.0.1:8880 node tests/test_teacher_multiplayer_setup_workflows_browser.cjs
      - name: MATCH builder create, server save, reload, edit, responsive layout and launch
        run: node tests/test_match_setup_workflow_browser.cjs
      - name: MILLION builder create, remote save, session reset and reload
        run: |
          mkdir -p /tmp/mothership-million-studio-test
          MOTHERSHIP_NO_BROWSER=1 MOTHERSHIP_DATA_DIR=/tmp/mothership-million-studio-test PORT=8878 python server.py >/tmp/million-studio-test.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8878/api/health >/dev/null; then break; fi
            sleep 1
          done
          LOCAL_URL=http://127.0.0.1:8878 node tests/test_million_studio_browser.cjs
      - name: Unified teacher Mission Control native actions and responsive geometry
        run: node tests/test_unified_teacher_controls_browser.cjs
      - name: Local failure diagnostics
        if: failure()
        run: tail -100 /tmp/student-companion.log || true
