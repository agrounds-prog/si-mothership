name: One-shot Mission Control panel polish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-panel-polish.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Guarded panel CSS patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html')
          raw=p.read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert sha=='c92f20914ed608bfdfe8df3183ade5923241921d',f'Stale source {sha}'
          assert 1300000<len(raw)<1400000
          s=raw.decode('utf-8')
          marker='id="v59-mission-panels"'
          assert marker not in s
          for selector in ('id="lobbyPanel"','id="agendaPanel"','id="activitiesPanel"','id="buzzPanel"','id="photoInboxPanel"','id="helpInboxPanel"','class="panel screen-dock"'):
            assert selector in s,selector
          css='''<style id="v59-mission-panels">
          /* Mission Control panel legibility; preserve content and interactions. */
          #teacher .roster-card .roster-head,
          #teacher .attention-panel .section-heading,
          #teacher .screen-dock .screen-dock-head{gap:10px!important}
          #teacher .roster-card .roster-head .eyebrow,
          #teacher .attention-panel .section-heading .v564-panel-label,
          #teacher .screen-dock .screen-dock-title{font-size:12px!important;line-height:1.35!important;letter-spacing:.065em!important}
          #teacher .attention-panel .section-heading>b{min-width:28px!important;min-height:28px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;font-size:13px!important}
          #teacher .attention-panel .empty{font-size:12px!important;line-height:1.5!important}
          #teacher .attention-panel button.clear,
          #teacher .screen-dock .launch-screen-btn,
          #teacher .roster-head-actions button{min-height:36px!important;font-size:12px!important;line-height:1.35!important}
          #teacher .attention-summary-copy>b{font-size:13px!important;line-height:1.4!important}
          #teacher .agenda-editor .agenda-tabs button{min-height:40px!important;font-size:12px!important}
          #teacher .agenda-editor .send-btn{min-height:44px!important;font-size:13px!important}
          #teacher .screen-dock .mirror-screen{min-height:180px!important}
          #teacher #agendaPanel .mode-title p,
          #teacher #activitiesPanel .mode-title p{font-size:13px!important;line-height:1.5!important}
          @media(max-width:1000px){
            #teacher .roster-head-actions{flex-wrap:wrap!important;gap:8px!important}
            #teacher .attention-summary{gap:10px!important}
          }
          </style>
          '''
          i=s.index('</head>')
          s=s[:i]+css+s[i:]
          assert s.count(marker)==1 and s.index(marker)<s.index('</head>')
          p.write_text(s,encoding='utf-8')
          new=p.read_bytes()
          print('INTEGRITY_OK',sha,'NEW_BLOB',hashlib.sha1(b'blob '+str(len(new)).encode()+b'\0'+new).hexdigest(),'BYTES',len(new))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve Mission Control panel readability"
          git push
