name: One-shot Student Picture Flow redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-picture-flow-redesign.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Redesign Student Picture Flow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "1bc1823dfe2b25131e0177ea907addbe3a0c6f7f"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="if(state.screen==='picture')return `<div class=\"student-prompt\"><span class=\"eyebrow\">PICTURE PROMPT</span><h2>Show your work</h2><p>${esc(state.picturePrompt)}</p><div class=\"prompt-caption\">Use <b>Take Picture</b> below to send the image privately to your teacher.</div></div>`;"
          new="if(state.screen==='picture'){const sent=state.photos.some(p=>p.name===s.n);return `<div class=\"student-prompt picture-prompt-surface\"><span class=\"eyebrow\">PICTURE PROMPT</span><h2>Show your work</h2><p class=\"picture-prompt-copy\">${esc(state.picturePrompt)}</p><div class=\"picture-prompt-camera\" aria-hidden=\"true\"><span>📷</span></div><div class=\"prompt-caption picture-prompt-caption\">${sent?'<b>✓ Photo sent</b><span>Your teacher received it.</span>':'<b>Send a photo when you are ready</b><span>Use the blue Send Photo control below.</span>'}</div></div>`;}"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          marker='id="v67-student-picture-flow"'
          assert marker not in s
          block="<style id=\"v67-student-picture-flow\">body.role-student .student-prompt.picture-prompt-surface{width:min(100%,660px)!important;max-width:660px!important;padding:30px 24px 26px!important;border:2px solid #43cfff!important;border-radius:28px!important;background:radial-gradient(circle at 50% 0%,rgba(67,207,255,.24),transparent 36%),linear-gradient(180deg,#0a2b42,#061725 72%,#04111d)!important;box-shadow:inset 0 0 0 6px #020b13,inset 0 0 0 7px rgba(104,226,255,.12),0 20px 48px rgba(0,0,0,.42),0 0 34px rgba(67,207,255,.16)!important}body.role-student .picture-prompt-surface .eyebrow{color:#8feeff!important;font-size:11px!important;letter-spacing:.22em!important}body.role-student .picture-prompt-surface h2{margin:10px 0 8px!important;font-size:clamp(38px,8vw,56px)!important;line-height:1!important;color:#fff!important}body.role-student .picture-prompt-copy{margin:0 auto!important;max-width:540px!important;color:#d6ebf5!important;font-size:18px!important;line-height:1.35!important}body.role-student .picture-prompt-camera{width:94px!important;height:94px!important;margin:22px auto 14px!important;display:grid!important;place-items:center!important;border:2px solid #43cfff!important;border-radius:28px!important;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.18),transparent 30%),linear-gradient(145deg,#0a5878,#0c3956 60%,#082538)!important;box-shadow:0 0 26px rgba(67,207,255,.36),inset 0 0 22px rgba(67,207,255,.10)!important}.picture-prompt-camera span{font-size:44px!important}.picture-prompt-caption{margin:0 auto!important;max-width:500px!important;padding:11px 14px!important;border:1px solid rgba(111,230,255,.34)!important;border-radius:16px!important;background:#071b2a!important;color:#d9f5ff!important;font-size:12px!important}.picture-prompt-caption b,.picture-prompt-caption span{display:block!important}.picture-prompt-caption b{font-size:13px!important;color:#72e8ff!important}.picture-prompt-caption span{margin-top:3px!important;color:#9fc4d5!important}body.role-student .student-photo-composer{padding:14px!important;background:rgba(2,8,19,.88)!important;backdrop-filter:blur(12px)!important}body.role-student .student-photo-composer-card{width:min(560px,94vw)!important;padding:18px!important;border:2px solid #43cfff!important;border-radius:24px!important;background:radial-gradient(circle at 50% 0%,rgba(67,207,255,.18),transparent 34%),linear-gradient(155deg,#0b2134,#071522 72%,#04101a)!important;box-shadow:inset 0 0 0 5px #020b13,0 28px 90px rgba(0,0,0,.70),0 0 32px rgba(67,207,255,.20)!important}.student-photo-composer-head b{font-size:22px!important;color:#fff!important}.student-photo-composer-head small{color:#a9c5d5!important;font-size:12px!important}.student-photo-source-actions{gap:12px!important;margin:18px 0!important}.student-photo-source-actions button{min-height:126px!important;border:2px solid!important;border-radius:18px!important}.student-photo-source-actions #studentTakePhotoBtn{color:#74f2d0!important;border-color:#43e0b0!important;background:linear-gradient(180deg,#0d4b3d,#082c2b)!important}.student-photo-source-actions #studentUploadPhotoBtn{color:#72e8ff!important;border-color:#43cfff!important;background:linear-gradient(180deg,#0c4d67,#082b3e)!important}.student-photo-source-actions button span{font-size:38px!important}.student-photo-source-actions button b{font-size:16px!important;color:#fff!important}.student-photo-source-actions button small{color:#c5d9e4!important}.student-photo-preview-wrap{grid-template-columns:150px 1fr!important;gap:14px!important;padding:12px!important;border:2px solid #43cfff!important;border-radius:16px!important;background:#071b2a!important}.student-photo-preview-wrap img{width:150px!important;height:112px!important;border:1px solid #5ddcff!important;border-radius:12px!important}.student-photo-preview-wrap b{color:#fff!important}.student-photo-preview-wrap small{color:#a7c8d8!important}.student-photo-composer-actions{gap:10px!important;margin-top:16px!important}.student-photo-composer-actions button{min-height:46px!important;padding:11px 16px!important;border-radius:12px!important;font-size:13px!important}#studentPhotoSendBtn{border:2px solid #43e0b0!important;background:linear-gradient(145deg,#0f5a48,#0b3734)!important;color:#78ffd8!important;box-shadow:0 0 20px rgba(67,224,176,.22)!important}#studentPhotoSendBtn:disabled{opacity:.38!important;box-shadow:none!important}@media(max-width:520px){body.role-student .device-main:has(.picture-prompt-surface){padding:8px 7px 10px!important;min-height:0!important;align-items:flex-start!important}.student-prompt.picture-prompt-surface{padding:18px 12px 16px!important;border-radius:22px!important}.picture-prompt-surface h2{font-size:36px!important;margin:7px 0 6px!important}.picture-prompt-copy{font-size:14px!important}.picture-prompt-camera{width:74px!important;height:74px!important;margin:14px auto 10px!important}.picture-prompt-camera span{font-size:34px!important}.student-photo-composer-card{padding:14px!important}.student-photo-source-actions{grid-template-columns:1fr 1fr!important;gap:8px!important;margin:14px 0!important}.student-photo-source-actions button{min-height:100px!important;padding:8px!important}.student-photo-preview-wrap{grid-template-columns:92px 1fr!important}.student-photo-preview-wrap img{width:92px!important;height:76px!important}}</style>"
          pos=s.index("</head>")
          s=s[:pos]+block+"\n"+s[pos:]
          assert s.count(marker)==1
          assert s.index(marker)<s.index("</head>")
          p.write_text(s,encoding="utf-8")
          print("bytes",p.stat().st_size)
          PY
          rm -f .github/workflows/one-shot-picture-flow-redesign.yml
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-picture-flow-redesign.yml
          git commit -m 'Redesign Student Picture Flow'
          git push origin HEAD:main
