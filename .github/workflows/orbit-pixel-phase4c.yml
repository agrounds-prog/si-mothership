name: ORBIT Phase 4C and PIXEL REVEAL Browser Verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'orbit-polish.js'
      - 'orbit-polish.css'
      - 'pixel-batch.js'
      - 'pixel-batch.css'
      - 'tests/test_orbit_classroom_browser.cjs'
      - 'tests/test_pixel_batch_browser.cjs'
      - '.github/workflows/orbit-pixel-phase4c.yml'

permissions: {contents: read}
jobs:
  orbit-pixel:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source and release gate
        run: |
          node --check orbit-polish.js
          node --check pixel-batch.js
          node --check tests/test_orbit_classroom_browser.cjs
          node --check tests/test_pixel_batch_browser.cjs
          python scripts/release_gate.py --require-node
      - name: Install isolated browser dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated classroom
        run: |
          mkdir -p /tmp/mothership-orbit-pixel-4c
          MOTHERSHIP_NO_BROWSER=1 MOTHERSHIP_DATA_DIR=/tmp/mothership-orbit-pixel-4c PORT=8877 python server.py >/tmp/orbit-pixel-phase4c.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8877/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/orbit-pixel-phase4c.log
          exit 1
      - name: ORBIT cinematic solar systems, 24-idea gallery and privacy
        run: LOCAL_URL=http://127.0.0.1:8877 node tests/test_orbit_classroom_browser.cjs
      - name: PIXEL REVEAL 12-image-ready workflow, save/reload and round isolation
        run: LOCAL_URL=http://127.0.0.1:8877 node tests/test_pixel_batch_browser.cjs
      - name: Diagnostics on failure
        if: failure()
        run: tail -100 /tmp/orbit-pixel-phase4c.log || true
