name: Inspect Word Grid Integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-word-grid-integration.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect game registry hooks and state model
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename,needles in {
           'index.html':['const APPS','const APP','ACTIVITY_REGISTRY','APP_REGISTRY','function startActivity','function renderActivity','function renderActivities','function renderShared','function renderStudent','function renderHome','function sendGameShowAction','function renderActivityController','function launchMillion','function renderTeacher','function render()','function wire','function saveState','function publishSyncedState','const state=','const state =','const APP_LIBRARY','function normalizeState','app-shortcut-label','ACTIVITY_CATALOG'],
           'server.py':['app.router.add','async def index','async def handle_index','async def state','async def api','quick_poll','QuickPollService','def create_app','@web.middleware','async def start','async def teacher','def session','async def websocket']
          }.items():
           s=Path(filename).read_text().splitlines()
           print('=== FILE',filename,len(s),'LINES ===')
           for needle in needles:
            hits=[i for i,x in enumerate(s) if needle in x and not x.strip().startswith('//')]
            print('##',needle, 'HITS:',len(hits),'LINES:',[i+1 for i in hits[:9]])
            for i in hits[:2]:
             for j in range(max(0,i-3),min(i+12,len(s))):
              print(f'{j+1}: {s[j][:280]}')
           if filename=='index.html':
            for a,b in [(11800,11870)]:
             for j in range(a-1,min(b,len(s))):print(f'{j+1}: {s[j][:300]}')
          print('=== TARGETED CLIENT AND SERVER ===')
          src=Path('index.html').read_text().splitlines()
          for a,b in [(15520,15552),(15645,15690),(16795,16832),(16880,16915),(17995,18070),(18338,18368),(18393,18455),(18475,18515),(19150,19190),(19203,19220)]:
           print('### INDEX',a,b)
           for j in range(a-1,b):print(f'{j+1}: {src[j][:550]}')
          ss=Path('server.py').read_text().splitlines()
          for a,b in [(4865,4922),(5970,6032)]:
           print('### SERVER',a,b)
           for j in range(a-1,b):print(f'{j+1}: {ss[j][:550]}')
          print('=== WORDGRID HOOK ANCHORS ===')
          s=Path('index.html').read_text().splitlines()
          for needle in ['function activeActivity','function sharedMarkup','function studentMarkup','function openApp(','function launchActivity','function startLoadedActivity','function renderActivityController','function renderStudentControls','function initial()','const DEFAULT_ACTIVITIES','function activityLibraryCategoryFor','function activityLibrary', 'function appIconMarkup','function recordActivityLaunch','function renderActivities()','function saveActivityPreset','function renderPublic()']:
           hits=[i for i,x in enumerate(s) if needle in x]
           print('###',needle,[i+1 for i in hits[:6]])
           for i in hits[:1]:
            for j in range(max(0,i-2),min(len(s),i+28)):print(f'{j+1}: {s[j][:900]}')
          print('=== index injection anchors ===')
          for needle in ['</head>','</body>','function renderStudentControls','function renderActivities','window.MillionStudio','type:\'million\'','type:\'bingo\'']:
           hits=[i for i,x in enumerate(s) if needle in x];print(needle,[i+1 for i in hits[:10]])
          PY
