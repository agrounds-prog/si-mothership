name: One-shot Student Device fit controls
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-student-fit-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fit Student Device home controls on mobile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "2bcb5493e040a725af26a5a5b8d24aec039309ab"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker='id="v63-student-fit-home-controls"'
          assert marker not in s
          block="<style id=\"v63-student-fit-home-controls\">\n/* Mobile lobby compaction: keep all five home controls visible on one iPhone screen. */\n@media(max-width:520px){\n  body.role-student .device-head{\n    min-height:58px!important;\n    padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px!important;\n  }\n  body.role-student .device-head>span:first-child{\n    font-size:11px!important;\n    letter-spacing:.06em!important;\n  }\n  body.role-student #studentConnectionLabel{\n    padding:6px 8px!important;\n    font-size:9px!important;\n  }\n\n  body.role-student .device-main:has(.cinematic-lobby){\n    padding:6px 6px 8px!important;\n  }\n  body.role-student .cinematic-student-window.cinematic-lobby{\n    padding:14px 10px 12px!important;\n    border-radius:21px!important;\n  }\n  body.role-student .cinematic-lobby>.eyebrow{\n    margin:0!important;\n    font-size:9px!important;\n    letter-spacing:.20em!important;\n  }\n  body.role-student .cinematic-lobby>h2{\n    margin:3px 0 1px!important;\n    font-size:clamp(34px,9.5vw,44px)!important;\n    line-height:.98!important;\n  }\n  body.role-student .cinematic-lobby>p{\n    margin:2px auto 3px!important;\n    font-size:14px!important;\n    line-height:1.22!important;\n  }\n  body.role-student .cinematic-lobby>.cinematic-status-line{\n    margin:7px 0 0!important;\n    font-size:7px!important;\n    letter-spacing:.11em!important;\n  }\n  body.role-student .cinematic-lobby>.cinematic-pilot-card{\n    width:min(100%,286px)!important;\n    margin:8px auto 0!important;\n    padding:8px 8px 9px!important;\n    gap:6px!important;\n    border-radius:21px!important;\n  }\n  body.role-student .cinematic-lobby .cinematic-pilot-card .student-avatar-mini{\n    width:min(58vw,212px)!important;\n    height:min(58vw,212px)!important;\n    max-width:212px!important;\n    max-height:212px!important;\n    border-radius:19px!important;\n  }\n  body.role-student .cinematic-lobby .cinematic-pilot-card .student-avatar-mini img{\n    border-radius:14px!important;\n  }\n  body.role-student .cinematic-lobby .cinematic-pilot-card>.student-avatar-mini+span{\n    font-size:23px!important;\n    line-height:1!important;\n  }\n\n  body.role-student .student-control-zone{\n    padding:9px 7px calc(8px + env(safe-area-inset-bottom,0px))!important;\n  }\n  body.role-student .student-control-label{\n    padding:0 3px 7px!important;\n  }\n  body.role-student .student-control-label b{\n    font-size:10px!important;\n    letter-spacing:.14em!important;\n  }\n  body.role-student .student-actions.home-controls{\n    gap:7px!important;\n  }\n  body.role-student .student-actions.home-controls button[data-class-action]{\n    min-height:72px!important;\n    grid-template-columns:40px minmax(0,1fr)!important;\n    gap:7px!important;\n    padding:8px!important;\n    border-radius:15px!important;\n  }\n  body.role-student .student-actions.home-controls .student-command-icon{\n    width:38px!important;\n    height:38px!important;\n    font-size:20px!important;\n  }\n  body.role-student .student-actions.home-controls .student-command-copy{\n    gap:2px!important;\n  }\n  body.role-student .student-actions.home-controls .student-command-copy b{\n    font-size:12px!important;\n    line-height:1!important;\n  }\n  body.role-student .student-actions.home-controls .student-command-copy small{\n    font-size:7px!important;\n    line-height:1.12!important;\n  }\n  body.role-student .student-actions.home-controls button[data-class-action=\"picture\"]{\n    min-height:64px!important;\n  }\n  body.role-student .student-actions.home-controls button[data-class-action]::after{\n    right:7px!important;\n    bottom:6px!important;\n    width:24px!important;\n    height:3px!important;\n  }\n}\n</style>"
          pos=s.index("</head>")
          s=s[:pos]+block+"\n"+s[pos:]
          assert s.count(marker)==1
          assert s.index(marker)<s.index("</head>")
          p.write_text(s,encoding="utf-8")
          print("bytes",p.stat().st_size)
          PY
          rm -f .github/workflows/one-shot-student-fit-controls.yml
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-student-fit-controls.yml
          git commit -m 'Fit Student Device controls on iPhone lobby'
          git push origin HEAD:main
