name: One-shot Student Emotion Check redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-emotion-check-redesign.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Redesign Student Emotion Check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "c4256c8eadf37976f9f173e5d91e2c1ebbff510c"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="if(state.screen==='emotion'){\n    const opts=[['😄','Great'],['🙂','Good'],['😐','Okay'],['😟','Worried'],['😣','Upset']];\n    return `<div class=\"student-prompt\"><span class=\"eyebrow\">EMOTION CHECK</span><h2>How are you feeling?</h2><div class=\"response-grid emotion\">${opts.map(([e,v])=>`<button class=\"response-btn ${s.emotion===v?'selected':''}\" data-response=\"emotion\" data-value=\"${v}\">${e}<small>${v}</small></button>`).join('')}</div></div>`;\n  }"
          new="if(state.screen==='emotion'){\n    const opts=[['😄','Great'],['🙂','Good'],['😐','Okay'],['😟','Worried'],['😣','Upset']];\n    return `<div class=\"student-prompt emotion-check-surface\"><span class=\"eyebrow\">EMOTION CHECK</span><h2>How are you feeling?</h2><p>Choose the answer that fits you best.</p><div class=\"response-grid emotion\">${opts.map(([e,v])=>`<button class=\"response-btn emotion-choice ${s.emotion===v?'selected':''}\" data-response=\"emotion\" data-value=\"${v}\"><span>${e}</span><small>${v}</small></button>`).join('')}</div>${s.emotion?`<div class=\"emotion-confirmation\">${s.emotion} response sent to your teacher</div>`:''}</div>`;\n  }"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          marker='id="v65-student-emotion-check"'
          assert marker not in s
          block="<style id=\"v65-student-emotion-check\">\nbody.role-student .student-prompt.emotion-check-surface{width:min(100%,680px)!important;max-width:680px!important;padding:30px 24px 28px!important;border:2px solid #3bbce9!important;border-radius:28px!important;background:radial-gradient(circle at 50% 0%,rgba(54,193,241,.22),transparent 36%),linear-gradient(180deg,#0a2a41,#061725 72%,#04111d)!important;box-shadow:inset 0 0 0 6px #020b13,inset 0 0 0 7px rgba(104,226,255,.12),0 20px 48px rgba(0,0,0,.42),0 0 32px rgba(51,202,255,.14)!important}\nbody.role-student .emotion-check-surface .eyebrow{color:#8feeff!important;font-size:11px!important;letter-spacing:.22em!important}\nbody.role-student .emotion-check-surface h2{margin:10px 0 6px!important;font-size:clamp(34px,7vw,52px)!important;line-height:1!important;color:#fff!important}\nbody.role-student .emotion-check-surface>p{margin:0!important;color:#bfd5e1!important;font-size:15px!important}\nbody.role-student .emotion-check-surface .response-grid.emotion{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:10px!important;max-width:640px!important;margin:22px auto 0!important}\nbody.role-student .emotion-check-surface .emotion-choice{min-height:126px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:8px!important;padding:12px 8px!important;border:2px solid!important;border-radius:22px!important;font-size:34px!important;line-height:1!important;font-weight:950!important;color:#fff!important;transition:transform .15s ease,filter .15s ease,box-shadow .15s ease!important}\nbody.role-student .emotion-check-surface .emotion-choice small{margin:0!important;color:#fff!important;font-size:11px!important;font-weight:900!important;letter-spacing:.02em!important}\nbody.role-student .emotion-check-surface .emotion-choice[data-value=\"Great\"]{border-color:#40e9a5!important;background:radial-gradient(circle at 50% 30%,rgba(64,233,165,.42),transparent 38%),linear-gradient(180deg,#0c5a43,#082a2a)!important;box-shadow:0 0 24px rgba(64,233,165,.26)!important}\nbody.role-student .emotion-check-surface .emotion-choice[data-value=\"Good\"]{border-color:#62dfff!important;background:radial-gradient(circle at 50% 30%,rgba(98,223,255,.40),transparent 38%),linear-gradient(180deg,#0b4f67,#08283a)!important;box-shadow:0 0 24px rgba(98,223,255,.24)!important}\nbody.role-student .emotion-check-surface .emotion-choice[data-value=\"Okay\"]{border-color:#ffd45a!important;background:radial-gradient(circle at 50% 30%,rgba(255,212,90,.38),transparent 38%),linear-gradient(180deg,#60470d,#30291a)!important;box-shadow:0 0 24px rgba(255,212,90,.22)!important}\nbody.role-student .emotion-check-surface .emotion-choice[data-value=\"Worried\"]{border-color:#ff9f59!important;background:radial-gradient(circle at 50% 30%,rgba(255,159,89,.38),transparent 38%),linear-gradient(180deg,#603017,#35211a)!important;box-shadow:0 0 24px rgba(255,159,89,.22)!important}\nbody.role-student .emotion-check-surface .emotion-choice[data-value=\"Upset\"]{border-color:#ff6f91!important;background:radial-gradient(circle at 50% 30%,rgba(255,111,145,.40),transparent 38%),linear-gradient(180deg,#5d1c31,#321923)!important;box-shadow:0 0 24px rgba(255,111,145,.24)!important}\nbody.role-student .emotion-check-surface .emotion-choice.selected{transform:translateY(-3px) scale(1.03)!important;filter:saturate(1.25) brightness(1.10)!important;outline:3px solid rgba(255,255,255,.88)!important;outline-offset:2px!important}\nbody.role-student .emotion-check-surface .emotion-confirmation{margin-top:16px!important;padding:10px 14px!important;border:1px solid rgba(111,230,255,.34)!important;border-radius:999px!important;background:#071b2a!important;color:#ccefff!important;font-size:11px!important;font-weight:850!important}\n@media(max-width:520px){body.role-student .device-main:has(.emotion-check-surface){padding:8px 7px 10px!important;min-height:0!important;align-items:flex-start!important}body.role-student .student-prompt.emotion-check-surface{padding:18px 11px 16px!important;border-radius:22px!important}body.role-student .emotion-check-surface h2{font-size:34px!important;margin:7px 0 5px!important}body.role-student .emotion-check-surface>p{font-size:13px!important}body.role-student .emotion-check-surface .response-grid.emotion{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:6px!important;margin-top:16px!important}body.role-student .emotion-check-surface .emotion-choice{min-height:92px!important;padding:8px 3px!important;gap:5px!important;border-radius:16px!important;font-size:28px!important}body.role-student .emotion-check-surface .emotion-choice small{font-size:8px!important}body.role-student .emotion-check-surface .emotion-confirmation{margin-top:11px!important;font-size:9px!important}}\n</style>"
          pos=s.index("</head>")
          s=s[:pos]+block+"\n"+s[pos:]
          assert s.count(marker)==1
          assert s.index(marker)<s.index("</head>")
          p.write_text(s,encoding="utf-8")
          print("bytes",p.stat().st_size)
          PY
          rm -f .github/workflows/one-shot-emotion-check-redesign.yml
          git config user.name 'SI Mothership Visual Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-emotion-check-redesign.yml
          git commit -m 'Redesign Student Emotion Check'
          git push origin HEAD:main
